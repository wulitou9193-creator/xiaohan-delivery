;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;in distress&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;处于痛苦/危难中&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;distress signal&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;求救信号&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;emotional distress&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;情感痛苦&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;cause distress&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;引起痛苦&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;distress call&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;求救电话&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-example&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;✏️ 真实例句&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;The ship sent out a &lt;mark class=&#x27;target&#x27;&gt;distress&lt;/mark&gt; signal when it started to sink.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;船开始下沉时发出了求救信号。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;She was in obvious &lt;mark class=&#x27;target&#x27;&gt;distress&lt;/mark&gt; after hearing the bad news.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;听到那个坏消息后，她明显很痛苦。&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-confuse&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔍 近义辨析&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;b&gt;sorrow&lt;/b&gt;（悲伤）— sorrow 侧重因失去或遗憾引起的长期悲伤；distress 更强调紧迫、需要帮助的危难或痛苦。&lt;/li&gt;&lt;li&gt;&lt;b&gt;anguish&lt;/b&gt;（极度痛苦）— anguish 程度比 distress 更深，常指身心折磨；distress 可指较轻的烦恼或紧急情况。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;concept-map&#x27;&gt;&lt;div class=&#x27;concept-center&#x27;&gt;distress&lt;/div&gt;&lt;div class=&#x27;concept-nodes&#x27;&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;distressed&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;distressing&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;distressingly&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;stress&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;in distress&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;distress signal&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;emotional distress&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;cause distress&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;distress call&lt;/span&gt;&lt;span class=&#x27;concept-node synonym&#x27;&gt;sorrow&lt;/span&gt;&lt;span class=&#x27;concept-node synonym&#x27;&gt;anguish&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-output hidden&#x27;&gt;&lt;span class=&#x27;phase-tag output&#x27;&gt;再输出&lt;/span&gt;&lt;p class=&#x27;out-q&#x27;&gt;把 distress 填回句子：&lt;/p&gt;&lt;p class=&#x27;out-sentence&#x27;&gt;The ship sent out a ______ signal when it started to sink.&lt;/p&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out5&#x27; value=&#x27;awkward&#x27;&gt; awkward&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out5&#x27; value=&#x27;distress&#x27;&gt; distress&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out5&#x27; value=&#x27;clumsy&#x27;&gt; clumsy&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out5&#x27; value=&#x27;anxiety&#x27;&gt; anxiety&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;hidden out-fb&#x27;&gt;&lt;p class=&#x27;fb-line fb-ok&#x27;&gt;✓ 正确答案：&lt;b&gt;distress&lt;/b&gt; UK /dɪ&amp;#x27;stres/ US /dɪ&amp;#x27;strɛs/&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;📝 完整句：The ship sent out a distress signal when it started to sink.&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;🀄 译文：船开始下沉时发出了求救信号。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wcard new&#x27; data-block=&#x27;words&#x27; data-card=&#x27;6&#x27; data-word=&#x27;disturbing&#x27;&gt;&lt;div class=&#x27;wcard-top&#x27;&gt;&lt;span class=&#x27;wtag new&#x27;&gt;新词&lt;/span&gt;&lt;span class=&#x27;wnum&#x27;&gt;06 / 12&lt;/span&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-think&#x27;&gt;&lt;span class=&#x27;phase-tag think&#x27;&gt;先思考&lt;/span&gt;&lt;p class=&#x27;think-q&#x27;&gt;看中文，先在心里回忆 / 试着读出来：&lt;/p&gt;&lt;p class=&#x27;meaning&#x27;&gt;扰人的；引起不安的&lt;/p&gt;&lt;div class=&#x27;rbtns&#x27;&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;1&#x27; class=&#x27;rate&#x27;&gt;忘了&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;3&#x27; class=&#x27;rate&#x27;&gt;模糊&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;4&#x27; class=&#x27;rate&#x27;&gt;想起&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;5&#x27; class=&#x27;rate&#x27;&gt;熟练&lt;/button&gt;&lt;/div&gt;&lt;p class=&#x27;rate-msg&#x27;&gt;&lt;/p&gt;&lt;p class=&#x27;hint&#x27;&gt;评分 = 揭晓答案 + 展开输入内容&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-input hidden&#x27;&gt;&lt;span class=&#x27;phase-tag input&#x27;&gt;再输入&lt;/span&gt;&lt;div class=&#x27;hero-area&#x27;&gt;&lt;div class=&#x27;hero-info&#x27;&gt;&lt;p class=&#x27;hero-word&#x27;&gt;&lt;span class=&#x27;morph-part morph-prefix&#x27;&gt;dis&lt;/span&gt;&lt;span class=&#x27;morph-part morph-root&#x27;&gt;turb&lt;/span&gt;&lt;span class=&#x27;morph-part morph-suffix&#x27;&gt;ing&lt;/span&gt;&lt;/p&gt;&lt;p class=&#x27;hero-phon&#x27;&gt;&lt;span class=&#x27;hero-pos&#x27;&gt;adj.&lt;/span&gt; &lt;audio controls preload=&#x27;none&#x27; src=&#x27;output/Day_129/audio/disturbing_en.mp3&#x27;&gt;&lt;source src=&#x27;output/Day_129/audio/disturbing_en.m4a&#x27;&gt;&lt;/audio&gt;&lt;/p&gt;&lt;p class=&#x27;hero-meaning&#x27;&gt;扰人的；引起不安的&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;hero-img&#x27;&gt;&lt;img class=&#x27;anchor-img&#x27; src=&#x27;data/images/disturbing.png&#x27; alt=&#x27;disturbing 画面锚&#x27;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;ans-box&#x27;&gt;&lt;div class=&#x27;rich&#x27;&gt;&lt;div class=&#x27;rich-sec sec-etym&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;📖 词根拆解&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;来自拉丁语 disturbare（dis- 表示&amp;#x27;分开、加强&amp;#x27; + turbare 表示&amp;#x27;搅乱&amp;#x27;），经古法语 destourber 传入英语。原意是把平静的事物搅动起来，引申为让人心神不宁。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-memory&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🧠 记忆法&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;词根拆分法：dis-（分开）+ turb（搅动），把平静搅开 → 扰乱，引申为令人不安的。&lt;/li&gt;&lt;li&gt;场景联想法：半夜看新闻，画面里的战乱场景让你心里发慌，那种感觉就是 disturbing。&lt;/li&gt;&lt;li&gt;对比记忆法：disturb 是动词（打扰、使不安），disturbing 是形容词（令人不安的），disturbed 则常形容人感到不安。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-usage&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;💡 用法&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;disturbing 通常修饰事物或事件，表示“令人不安的”，主语是物时常用；若修饰人，则常用 disturbed。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-error&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;⚠️ 易错点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;The news was very disturb.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ The news was very disturbing.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;disturb 是动词，此处需要形容词形式，用 disturbing。&lt;/div&gt;&lt;/li&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;He was disturbing because he failed the exam.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ He was disturbed because he failed the exam.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;形容人感到不安时用 disturbed，而不是 disturbing。&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-exam&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🎯 考点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;在完形填空中常考 disturb / disturbing / disturbed 的区分，注意修饰对象是人还是物。&lt;/li&gt;&lt;li&gt;写作中可用 deeply disturbing 替换 very bad，提升表达档次。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-family&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🌳 词族&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;disturb&lt;/b&gt; v. 打扰；使不安&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;disturbed&lt;/b&gt; adj. 不安的；心理有困扰的&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;disturbance&lt;/b&gt; n. 干扰；骚乱&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;undisturbed&lt;/b&gt; adj. 不受打扰的；平静的&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-colloc&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔗 常见搭配&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;disturbing news&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;令人不安的消息&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;disturbing trend&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;令人担忧的趋势&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;deeply disturbing&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;极其令人不安的&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;disturbing thought&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;烦人的念头&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;disturbing evidence&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;令人不安的证据&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-example&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;✏️ 真实例句&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;The &lt;mark class=&#x27;target&#x27;&gt;disturbing&lt;/mark&gt; images from the flood left everyone speechless.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;洪水那些令人不安的画面让所有人都说不出话来。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;She found his habit of staring at her really &lt;mark class=&#x27;target&#x27;&gt;disturbing&lt;/mark&gt;.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;她发现他盯着她看的习惯真的很让人不安。&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-confuse&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔍 近义辨析&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;b&gt;upsetting&lt;/b&gt;（令人沮丧的，心烦的）— upsetting 侧重情绪上感到难过或烦躁，而 disturbing 更强调扰乱心神、使人不安，语气更重。&lt;/li&gt;&lt;li&gt;&lt;b&gt;troubling&lt;/b&gt;（令人烦恼的，令人担忧的）— troubling 更侧重引发忧虑，常指需要关注的问题；disturbing 则更强调心理上的不安和扰动。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;concept-map&#x27;&gt;&lt;div class=&#x27;concept-center&#x27;&gt;disturbing&lt;/div&gt;&lt;div class=&#x27;concept-nodes&#x27;&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;disturb&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;disturbed&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;disturbance&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;undisturbed&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;disturbing news&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;disturbing trend&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;deeply disturbing&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;disturbing thought&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;disturbing evidence&lt;/span&gt;&lt;span class=&#x27;concept-node synonym&#x27;&gt;upsetting&lt;/span&gt;&lt;span class=&#x27;concept-node synonym&#x27;&gt;troubling&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-output hidden&#x27;&gt;&lt;span class=&#x27;phase-tag output&#x27;&gt;再输出&lt;/span&gt;&lt;p class=&#x27;out-q&#x27;&gt;把 disturbing 填回句子：&lt;/p&gt;&lt;p class=&#x27;out-sentence&#x27;&gt;The ______ images from the flood left everyone speechless.&lt;/p&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out6&#x27; value=&#x27;anxiety&#x27;&gt; anxiety&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out6&#x27; value=&#x27;clumsy&#x27;&gt; clumsy&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out6&#x27; value=&#x27;disturbing&#x27;&gt; disturbing&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out6&#x27; value=&#x27;awkward&#x27;&gt; awkward&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;hidden out-fb&#x27;&gt;&lt;p class=&#x27;fb-line fb-ok&#x27;&gt;✓ 正确答案：&lt;b&gt;disturbing&lt;/b&gt; &lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;📝 完整句：The disturbing images from the flood left everyone speechless.&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;🀄 译文：洪水那些令人不安的画面让所有人都说不出话来。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wcard new&#x27; data-block=&#x27;words&#x27; data-card=&#x27;7&#x27; data-word=&#x27;dread&#x27;&gt;&lt;div class=&#x27;wcard-top&#x27;&gt;&lt;span class=&#x27;wtag new&#x27;&gt;新词&lt;/span&gt;&lt;span class=&#x27;wnum&#x27;&gt;07 / 12&lt;/span&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-think&#x27;&gt;&lt;span class=&#x27;phase-tag think&#x27;&gt;先思考&lt;/span&gt;&lt;p class=&#x27;think-q&#x27;&gt;看中文，先在心里回忆 / 试着读出来：&lt;/p&gt;&lt;p class=&#x27;meaning&#x27;&gt;恐惧；害怕；担忧&lt;/p&gt;&lt;div class=&#x27;rbtns&#x27;&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;1&#x27; class=&#x27;rate&#x27;&gt;忘了&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;3&#x27; class=&#x27;rate&#x27;&gt;模糊&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;4&#x27; class=&#x27;rate&#x27;&gt;想起&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;5&#x27; class=&#x27;rate&#x27;&gt;熟练&lt;/button&gt;&lt;/div&gt;&lt;p class=&#x27;rate-msg&#x27;&gt;&lt;/p&gt;&lt;p class=&#x27;hint&#x27;&gt;评分 = 揭晓答案 + 展开输入内容&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-input hidden&#x27;&gt;&lt;span class=&#x27;phase-tag input&#x27;&gt;再输入&lt;/span&gt;&lt;div class=&#x27;hero-area&#x27;&gt;&lt;div class=&#x27;hero-info&#x27;&gt;&lt;p class=&#x27;hero-word&#x27;&gt;&lt;span class=&#x27;morph-part morph-root&#x27;&gt;dread&lt;/span&gt;&lt;/p&gt;&lt;p class=&#x27;hero-phon&#x27;&gt;&lt;span class=&#x27;hero-pos&#x27;&gt;v./n.&lt;/span&gt;UK /dred/ US /drɛd/ &lt;audio controls preload=&#x27;none&#x27; src=&#x27;output/Day_129/audio/dread_en.mp3&#x27;&gt;&lt;source src=&#x27;output/Day_129/audio/dread_en.m4a&#x27;&gt;&lt;/audio&gt;&lt;/p&gt;&lt;p class=&#x27;hero-meaning&#x27;&gt;恐惧；害怕；担忧&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;hero-img&#x27;&gt;&lt;img class=&#x27;anchor-img&#x27; src=&#x27;data/images/dread.png&#x27; alt=&#x27;dread 画面锚&#x27;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;ans-box&#x27;&gt;&lt;div class=&#x27;rich&#x27;&gt;&lt;div class=&#x27;rich-sec sec-etym&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;📖 词根拆解&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;源自古英语 &amp;#x27;ondrǣdan&amp;#x27;，意为&amp;#x27;害怕、恐惧&amp;#x27;，由 &amp;#x27;ond-&amp;#x27;（反对）和 &amp;#x27;rǣdan&amp;#x27;（建议、思考）组成，字面意思是&amp;#x27;反对思考&amp;#x27;，即不敢去想。中古英语时期简化为 &amp;#x27;draden&amp;#x27;，最终演变为现代英语的 &amp;#x27;dread&amp;#x27;。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-memory&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🧠 记忆法&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;词源故事法：古英语中 &amp;#x27;dread&amp;#x27; 本意是&amp;#x27;不敢去想&amp;#x27;——想象你害怕明天的考试，连想都不敢想，那种感觉就是 dread。&lt;/li&gt;&lt;li&gt;场景联想法：深夜独自在家，听到门外有脚步声，你不敢开门去看——那种手心冒汗、心跳加速的感觉就是 dread。&lt;/li&gt;&lt;li&gt;对比记忆法：dread 比 fear 程度更深，fear 是&amp;#x27;害怕&amp;#x27;，dread 是&amp;#x27;极度恐惧、甚至不敢面对&amp;#x27;。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-usage&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;💡 用法&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;作动词时常用 dread doing sth. 或 dread to do sth.，表示&amp;#x27;害怕做某事&amp;#x27;；作名词时不可数，常与 a sense of 搭配。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-error&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;⚠️ 易错点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;I dread to go to the party.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ I dread going to the party.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;dread 后接动名词（doing）比不定式更常见，表示害怕做某事。&lt;/div&gt;&lt;/li&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;He has a dread of snakes.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ He has a dread of snakes.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;dread 作名词时，常与 of 连用，表示对某事物的恐惧。&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-exam&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🎯 考点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;CET-4 完形填空：常考 dread 与 fear、terror 的辨析，注意 dread 后接动名词的用法。&lt;/li&gt;&lt;li&gt;高考写作：可用 dread 替换 fear，提升词汇档次，如 &amp;#x27;I dread the thought of failing the exam.&amp;#x27;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-family&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🌳 词族&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;dreadful&lt;/b&gt; adj. 可怕的；糟糕的&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;dreadfully&lt;/b&gt; adv. 可怕地；非常&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;dreaded&lt;/b&gt; adj. 令人恐惧的（常用作定语）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-colloc&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔗 常见搭配&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;dread the thought of&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;害怕想到……&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;live in dread of&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;生活在……的恐惧中&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;a sense of dread&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;一种恐惧感&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;dread doing sth.&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;害怕做某事&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-example&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;✏️ 真实例句&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;I &lt;mark class=&#x27;target&#x27;&gt;dread&lt;/mark&gt; going to the dentist because of the pain.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;我害怕去看牙医，因为太疼了。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;The thought of losing her job filled her with &lt;mark class=&#x27;target&#x27;&gt;dread&lt;/mark&gt;.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;一想到可能失业，她就充满了恐惧。&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-confuse&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔍 近义辨析&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;b&gt;fear&lt;/b&gt;（害怕）— fear 是通用词，程度较轻；dread 强调强烈的、令人不敢面对的恐惧。&lt;/li&gt;&lt;li&gt;&lt;b&gt;terror&lt;/b&gt;（恐怖）— terror 指极端的、突然的恐惧，常与暴力或威胁相关；dread 更偏向持续的、心理上的担忧。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;concept-map&#x27;&gt;&lt;div class=&#x27;concept-center&#x27;&gt;dread&lt;/div&gt;&lt;div class=&#x27;concept-nodes&#x27;&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;dreadful&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;dreadfully&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;dreaded&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;dread the thought of&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;live in dread of&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;a sense of dread&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;dread doing sth.&lt;/span&gt;&lt;span class=&#x27;concept-node synonym&#x27;&gt;fear&lt;/span&gt;&lt;span class=&#x27;concept-node synonym&#x27;&gt;terror&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-output hidden&#x27;&gt;&lt;span class=&#x27;phase-tag output&#x27;&gt;再输出&lt;/span&gt;&lt;p class=&#x27;out-q&#x27;&gt;把 dread 填回句子：&lt;/p&gt;&lt;p class=&#x27;out-sentence&#x27;&gt;I ______ going to the dentist because of the pain.&lt;/p&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out7&#x27; value=&#x27;awkward&#x27;&gt; awkward&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out7&#x27; value=&#x27;clumsy&#x27;&gt; clumsy&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out7&#x27; value=&#x27;dread&#x27;&gt; dread&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out7&#x27; value=&#x27;anxiety&#x27;&gt; anxiety&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;hidden out-fb&#x27;&gt;&lt;p class=&#x27;fb-line fb-ok&#x27;&gt;✓ 正确答案：&lt;b&gt;dread&lt;/b&gt; UK /dred/ US /drɛd/&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;📝 完整句：I dread going to the dentist because of the pain.&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;🀄 译文：我害怕去看牙医，因为太疼了。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wcard new&#x27; data-block=&#x27;words&#x27; data-card=&#x27;8&#x27; data-word=&#x27;poisonous&#x27;&gt;&lt;div class=&#x27;wcard-top&#x27;&gt;&lt;span class=&#x27;wtag new&#x27;&gt;新词&lt;/span&gt;&lt;span class=&#x27;wnum&#x27;&gt;08 / 12&lt;/span&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-think&#x27;&gt;&lt;span class=&#x27;phase-tag think&#x27;&gt;先思考&lt;/span&gt;&lt;p class=&#x27;think-q&#x27;&gt;看中文，先在心里回忆 / 试着读出来：&lt;/p&gt;&lt;p class=&#x27;meaning&#x27;&gt;有毒的，有害的&lt;/p&gt;&lt;div class=&#x27;rbtns&#x27;&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;1&#x27; class=&#x27;rate&#x27;&gt;忘了&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;3&#x27; class=&#x27;rate&#x27;&gt;模糊&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;4&#x27; class=&#x27;rate&#x27;&gt;想起&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;5&#x27; class=&#x27;rate&#x27;&gt;熟练&lt;/button&gt;&lt;/div&gt;&lt;p class=&#x27;rate-msg&#x27;&gt;&lt;/p&gt;&lt;p class=&#x27;hint&#x27;&gt;评分 = 揭晓答案 + 展开输入内容&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-input hidden&#x27;&gt;&lt;span class=&#x27;phase-tag input&#x27;&gt;再输入&lt;/span&gt;&lt;div class=&#x27;hero-area&#x27;&gt;&lt;div class=&#x27;hero-info&#x27;&gt;&lt;p class=&#x27;hero-word&#x27;&gt;&lt;span class=&#x27;morph-part morph-root&#x27;&gt;poison&lt;/span&gt;&lt;span class=&#x27;morph-part morph-suffix&#x27;&gt;ous&lt;/span&gt;&lt;/p&gt;&lt;p class=&#x27;hero-phon&#x27;&gt;&lt;span class=&#x27;hero-pos&#x27;&gt;adj&lt;/span&gt;UK /pɒɪzənəs/ US /pɔɪzənəs/ &lt;audio controls preload=&#x27;none&#x27; src=&#x27;output/Day_129/audio/poisonous_en.mp3&#x27;&gt;&lt;source src=&#x27;output/Day_129/audio/poisonous_en.m4a&#x27;&gt;&lt;/audio&gt;&lt;/p&gt;&lt;p class=&#x27;hero-meaning&#x27;&gt;有毒的，有害的&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;hero-img&#x27;&gt;&lt;img class=&#x27;anchor-img&#x27; src=&#x27;data/images/poisonous.png&#x27; alt=&#x27;poisonous 画面锚&#x27;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;ans-box&#x27;&gt;&lt;div class=&#x27;rich&#x27;&gt;&lt;div class=&#x27;rich-sec sec-etym&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;📖 词根拆解&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;源自13世纪古法语 &amp;#x27;poison&amp;#x27;（毒药），最终来自拉丁语 &amp;#x27;potio&amp;#x27;（饮料，尤指毒酒）。&amp;#x27;poison&amp;#x27; 本义是“饮料”，后来特指“毒药”。后缀 &amp;#x27;-ous&amp;#x27; 来自拉丁语 &amp;#x27;-osus&amp;#x27;，表示“充满……的”。所以 poisonous 字面意思是“充满毒药的”。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-memory&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🧠 记忆法&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;词根拆分法：poison（毒药）+ ous（充满……的）→ 充满毒药的 → 有毒的。&lt;/li&gt;&lt;li&gt;场景联想法：想象一个鲜艳的蘑菇，上面写着“POISON”，旁边有骷髅标志，提醒你它有毒。&lt;/li&gt;&lt;li&gt;对比记忆法：对比 poison（毒药）和 potion（药水），发音相似但意思相反，一个要命一个救命。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-usage&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;💡 用法&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;既可指物理上的有毒（如毒蛇、毒药），也可比喻有害的（如有毒的关系、言论）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-error&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;⚠️ 易错点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;This mushroom is very poison.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ This mushroom is very poisonous.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;poison 是名词，poisonous 才是形容词。&lt;/div&gt;&lt;/li&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;He gave me a poisonous look.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ He gave me a venomous look.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;形容眼神恶毒时，常用 venomous 而非 poisonous。&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-exam&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🎯 考点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;完形填空：常考 poisonous 与 toxic 的辨析，注意 poisonous 更常用于生物毒。&lt;/li&gt;&lt;li&gt;写作：可用于描述人际关系或环境问题，如 &amp;#x27;a poisonous atmosphere in the office&amp;#x27;。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-family&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🌳 词族&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;poison&lt;/b&gt; n./v. 毒药；下毒&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;poisoner&lt;/b&gt; n. 投毒者&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;poisoning&lt;/b&gt; n. 中毒&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;poisonously&lt;/b&gt; adv. 有毒地&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-colloc&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔗 常见搭配&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;poisonous snake&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;毒蛇&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;poisonous gas&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;有毒气体&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;poisonous relationship&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;有害的关系&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;poisonous plant&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;有毒植物&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;poisonous atmosphere&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;有毒的氛围&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-example&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;✏️ 真实例句&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;The snake&amp;#x27;s venom is highly &lt;mark class=&#x27;target&#x27;&gt;poisonous&lt;/mark&gt; and can kill a person within minutes.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;这条蛇的毒液毒性极强，几分钟内就能致人死亡。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;Their relationship had become &lt;mark class=&#x27;target&#x27;&gt;poisonous&lt;/mark&gt;, filled with jealousy and resentment.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;他们的关系变得有毒，充满了嫉妒和怨恨。&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-confuse&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔍 近义辨析&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;b&gt;toxic&lt;/b&gt;（有毒的）— toxic 更强调化学或环境毒性，也可用于比喻；poisonous 更强调直接致毒，常用于生物毒。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;concept-map&#x27;&gt;&lt;div class=&#x27;concept-center&#x27;&gt;poisonous&lt;/div&gt;&lt;div class=&#x27;concept-nodes&#x27;&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;poison&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;poisoner&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;poisoning&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;poisonously&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;poisonous snake&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;poisonous gas&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;poisonous relationship&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;poisonous plant&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;poisonous atmosphere&lt;/span&gt;&lt;span class=&#x27;concept-node synonym&#x27;&gt;toxic&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-output hidden&#x27;&gt;&lt;span class=&#x27;phase-tag output&#x27;&gt;再输出&lt;/span&gt;&lt;p class=&#x27;out-q&#x27;&gt;把 poisonous 填回句子：&lt;/p&gt;&lt;p class=&#x27;out-sentence&#x27;&gt;The snake&amp;amp;#x27;s venom is highly ______ and can kill a person within minutes.&lt;/p&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out8&#x27; value=&#x27;awkward&#x27;&gt; awkward&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out8&#x27; value=&#x27;anxiety&#x27;&gt; anxiety&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out8&#x27; value=&#x27;clumsy&#x27;&gt; clumsy&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out8&#x27; value=&#x27;poisonous&#x27;&gt; poisonous&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;hidden out-fb&#x27;&gt;&lt;p class=&#x27;fb-line fb-ok&#x27;&gt;✓ 正确答案：&lt;b&gt;poisonous&lt;/b&gt; UK /pɒɪzənəs/ US /pɔɪzənəs/&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;📝 完整句：The snake&amp;#x27;s venom is highly poisonous and can kill a person within minutes.&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;🀄 译文：这条蛇的毒液毒性极强，几分钟内就能致人死亡。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wcard review&#x27; data-block=&#x27;words&#x27; data-card=&#x27;9&#x27; data-word=&#x27;awareness&#x27;&gt;&lt;div class=&#x27;wcard-top&#x27;&gt;&lt;span class=&#x27;wtag review&#x27;&gt;复习&lt;/span&gt;&lt;span class=&#x27;wnum&#x27;&gt;09 / 12&lt;/span&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-think&#x27;&gt;&lt;span class=&#x27;phase-tag think&#x27;&gt;先思考&lt;/span&gt;&lt;p class=&#x27;think-q&#x27;&gt;看中文，先在心里回忆 / 试着读出来：&lt;/p&gt;&lt;p class=&#x27;meaning&#x27;&gt;意识；察觉；认识&lt;/p&gt;&lt;div class=&#x27;rbtns&#x27;&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;1&#x27; class=&#x27;rate&#x27;&gt;忘了&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;3&#x27; class=&#x27;rate&#x27;&gt;模糊&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;4&#x27; class=&#x27;rate&#x27;&gt;想起&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;5&#x27; class=&#x27;rate&#x27;&gt;熟练&lt;/button&gt;&lt;/div&gt;&lt;p class=&#x27;rate-msg&#x27;&gt;&lt;/p&gt;&lt;p class=&#x27;hint&#x27;&gt;评分 = 揭晓答案 + 展开输入内容&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-input hidden&#x27;&gt;&lt;span class=&#x27;phase-tag input&#x27;&gt;再输入&lt;/span&gt;&lt;div class=&#x27;hero-area&#x27;&gt;&lt;div class=&#x27;hero-info&#x27;&gt;&lt;p class=&#x27;hero-word&#x27;&gt;&lt;span class=&#x27;morph-part morph-root&#x27;&gt;aware&lt;/span&gt;&lt;span class=&#x27;morph-part morph-suffix&#x27;&gt;ness&lt;/span&gt;&lt;/p&gt;&lt;p class=&#x27;hero-phon&#x27;&gt;&lt;span class=&#x27;hero-pos&#x27;&gt;n&lt;/span&gt;UK /əˈweənəs/ US /ə&amp;#x27;wɛrnəs/ &lt;audio controls preload=&#x27;none&#x27; src=&#x27;output/Day_129/audio/awareness_en.mp3&#x27;&gt;&lt;source src=&#x27;output/Day_129/audio/awareness_en.m4a&#x27;&gt;&lt;/audio&gt;&lt;/p&gt;&lt;p class=&#x27;hero-meaning&#x27;&gt;意识；察觉；认识&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;hero-img&#x27;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;ans-box&#x27;&gt;&lt;div class=&#x27;rich&#x27;&gt;&lt;div class=&#x27;rich-sec sec-etym&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;📖 词根拆解&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;这个词来自古英语 &amp;#x27;gewær&amp;#x27;（警觉的、知道的），加上名词后缀 &amp;#x27;-ness&amp;#x27;。&amp;#x27;gewær&amp;#x27; 可以追溯到原始日耳曼语 *ga-waraz，与拉丁语 &amp;#x27;vereri&amp;#x27;（敬畏、小心）同源，核心意思是“保持警觉、注意到”。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-memory&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🧠 记忆法&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;词根拆分法：aware（知道、意识到）+ ness（名词后缀）= 知道的状态 → 意识。&lt;/li&gt;&lt;li&gt;场景联想法：想象你走在路上，突然闻到一股烧焦味，你立刻“意识到”（aware）危险，这种“意识状态”就是 awareness。&lt;/li&gt;&lt;li&gt;对比记忆法：awareness（意识）和 consciousness（知觉）对比：awareness 更强调对外部信息的察觉，consciousness 更强调内在的清醒状态。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-usage&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;💡 用法&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;awareness 是不可数名词，常与 of 连用，表示“对……的意识/认识”。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-error&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;⚠️ 易错点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;I have an awareness that he is lying.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ I am aware that he is lying.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;awareness 是名词，不能直接跟 that 从句。正确用法是 be aware that...&lt;/div&gt;&lt;/li&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;The awareness of the problem is important.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ Awareness of the problem is important.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;awareness 作为抽象名词，通常不加冠词 the，除非特指。&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-exam&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🎯 考点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;CET-4 完形填空：常考搭配 raise awareness of/about，注意介词搭配。&lt;/li&gt;&lt;li&gt;高考写作：可用 awareness 替换 knowledge，使表达更高级，如 raise public awareness of environmental protection。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-family&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🌳 词族&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;aware&lt;/b&gt; adj 意识到的&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;unaware&lt;/b&gt; adj 未意识到的&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;awareness&lt;/b&gt; n 意识&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;unawareness&lt;/b&gt; n 无意识&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-colloc&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔗 常见搭配&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;raise awareness&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;提高意识&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;public awareness&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;公众意识&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;awareness of&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;对……的意识&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;increase awareness&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;增强意识&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;brand awareness&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;品牌知名度&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-example&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;✏️ 真实例句&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;The campaign aims to raise public &lt;mark class=&#x27;target&#x27;&gt;awareness&lt;/mark&gt; about the dangers of plastic pollution.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;这项运动旨在提高公众对塑料污染危害的认识。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;There is a growing &lt;mark class=&#x27;target&#x27;&gt;awareness&lt;/mark&gt; of the need for sustainable energy sources.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;人们对可持续能源的需求意识日益增强。&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-confuse&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔍 近义辨析&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;b&gt;consciousness&lt;/b&gt;（知觉；意识）— awareness 强调对外界事物的察觉和认识，consciousness 更强调内在的清醒状态和主观体验。例如：He lost consciousness after the accident. 他事故后失去了知觉。而 awareness 则用于：He has no awareness of the risks. 他对风险毫无察觉。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;concept-map&#x27;&gt;&lt;div class=&#x27;concept-center&#x27;&gt;awareness&lt;/div&gt;&lt;div class=&#x27;concept-nodes&#x27;&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;aware&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;unaware&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;awareness&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;unawareness&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;raise awareness&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;public awareness&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;awareness of&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;increase awareness&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;brand awareness&lt;/span&gt;&lt;span class=&#x27;concept-node synonym&#x27;&gt;consciousness&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-output hidden&#x27;&gt;&lt;span class=&#x27;phase-tag output&#x27;&gt;再输出&lt;/span&gt;&lt;p class=&#x27;out-q&#x27;&gt;把 awareness 填回句子：&lt;/p&gt;&lt;p class=&#x27;out-sentence&#x27;&gt;The campaign aims to raise public ______ about the dangers of plastic pollution.&lt;/p&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out9&#x27; value=&#x27;anxiety&#x27;&gt; anxiety&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out9&#x27; value=&#x27;clumsy&#x27;&gt; clumsy&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out9&#x27; value=&#x27;awareness&#x27;&gt; awareness&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out9&#x27; value=&#x27;awkward&#x27;&gt; awkward&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;hidden out-fb&#x27;&gt;&lt;p class=&#x27;fb-line fb-ok&#x27;&gt;✓ 正确答案：&lt;b&gt;awareness&lt;/b&gt; UK /əˈweənəs/ US /ə&amp;#x27;wɛrnəs/&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;📝 完整句：The campaign aims to raise public awareness about the dangers of plastic pollution.&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;🀄 译文：这项运动旨在提高公众对塑料污染危害的认识。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wcard review&#x27; data-block=&#x27;words&#x27; data-card=&#x27;10&#x27; data-word=&#x27;coordination&#x27;&gt;&lt;div class=&#x27;wcard-top&#x27;&gt;&lt;span class=&#x27;wtag review&#x27;&gt;复习&lt;/span&gt;&lt;span class=&#x27;wnum&#x27;&gt;10 / 12&lt;/span&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-think&#x27;&gt;&lt;span class=&#x27;phase-tag think&#x27;&gt;先思考&lt;/span&gt;&lt;p class=&#x27;think-q&#x27;&gt;看中文，先在心里回忆 / 试着读出来：&lt;/p&gt;&lt;p class=&#x27;meaning&#x27;&gt;协调；配合；协作&lt;/p&gt;&lt;div class=&#x27;rbtns&#x27;&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;1&#x27; class=&#x27;rate&#x27;&gt;忘了&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;3&#x27; class=&#x27;rate&#x27;&gt;模糊&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;4&#x27; class=&#x27;rate&#x27;&gt;想起&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;5&#x27; class=&#x27;rate&#x27;&gt;熟练&lt;/button&gt;&lt;/div&gt;&lt;p class=&#x27;rate-msg&#x27;&gt;&lt;/p&gt;&lt;p class=&#x27;hint&#x27;&gt;评分 = 揭晓答案 + 展开输入内容&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-input hidden&#x27;&gt;&lt;span class=&#x27;phase-tag input&#x27;&gt;再输入&lt;/span&gt;&lt;div class=&#x27;hero-area&#x27;&gt;&lt;div class=&#x27;hero-info&#x27;&gt;&lt;p class=&#x27;hero-word&#x27;&gt;&lt;span class=&#x27;morph-part morph-prefix&#x27;&gt;co&lt;/span&gt;&lt;span class=&#x27;morph-part morph-root&#x27;&gt;ordin&lt;/span&gt;&lt;span class=&#x27;morph-part morph-suffix&#x27;&gt;at&lt;/span&gt;&lt;span class=&#x27;morph-part morph-suffix-2&#x27;&gt;ion&lt;/span&gt;&lt;/p&gt;&lt;p class=&#x27;hero-phon&#x27;&gt;&lt;span class=&#x27;hero-pos&#x27;&gt;n&lt;/span&gt;UK /kəuˌɔːdɪ&amp;#x27;neɪʃn/ US /ko,ɔrdɪ&amp;#x27;neʃən/ &lt;audio controls preload=&#x27;none&#x27; src=&#x27;output/Day_129/audio/coordination_en.mp3&#x27;&gt;&lt;source src=&#x27;output/Day_129/audio/coordination_en.m4a&#x27;&gt;&lt;/audio&gt;&lt;/p&gt;&lt;p class=&#x27;hero-meaning&#x27;&gt;协调；配合；协作&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;hero-img&#x27;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;ans-box&#x27;&gt;&lt;div class=&#x27;rich&#x27;&gt;&lt;div class=&#x27;rich-sec sec-etym&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;📖 词根拆解&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;来自拉丁语 coordinatio，由 com-（共同）+ ordinatio（排列）构成。ordinatio 源自 ordo（顺序、等级），原指“共同排列”，后引申为“协调配合”。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-memory&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🧠 记忆法&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;词根拆分法：co-（共同）+ ordin（顺序）+ ation（名词后缀）→ 让事物按共同顺序工作 → 协调。&lt;/li&gt;&lt;li&gt;场景联想法：想象一个交响乐团，指挥家让所有乐器同时演奏，这就是 coordination。&lt;/li&gt;&lt;li&gt;对比记忆法：coordination（协调）vs cooperation（合作）——合作是一起做，协调是安排谁做什么。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-usage&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;💡 用法&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;常与 between 或 of 搭配，强调多方之间的协调；也可指身体动作的协调性。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-error&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;⚠️ 易错点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;We need a good coordination.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ We need good coordination.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;coordination 作抽象名词时不可数，不加 a。&lt;/div&gt;&lt;/li&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;The coordination of the project is difficult.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ The coordination of the project is difficult.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;此句正确，但注意 coordination 后常接 of 引出协调的对象。&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-exam&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🎯 考点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;完形填空：常考 coordination 与 cooperation 的辨析，注意上下文是“安排”还是“一起做”。&lt;/li&gt;&lt;li&gt;写作：可用 coordination 替换 cooperation 以体现词汇多样性，如“加强部门间协调”用 enhance coordination between departments。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-family&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🌳 词族&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;coordinate&lt;/b&gt; v. 协调；使协调&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;coordinator&lt;/b&gt; n. 协调员&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;coordinated&lt;/b&gt; adj. 协调的；配合的&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;uncoordinated&lt;/b&gt; adj. 不协调的&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;coordinative&lt;/b&gt; adj. 协调的（正式）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-colloc&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔗 常见搭配&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;coordination between departments&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;部门间的协调&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;hand-eye coordination&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;手眼协调&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;coordination of efforts&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;协调各方努力&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;lack of coordination&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;缺乏协调&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;coordination meeting&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;协调会议&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-example&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;✏️ 真实例句&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;Good &lt;mark class=&#x27;target&#x27;&gt;coordination&lt;/mark&gt; between the marketing and sales teams is essential for the product launch.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;市场部和销售部之间的良好协调对产品发布至关重要。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;Playing the piano requires excellent hand-eye &lt;mark class=&#x27;target&#x27;&gt;coordination&lt;/mark&gt;.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;弹钢琴需要极佳的手眼协调能力。&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-confuse&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔍 近义辨析&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;b&gt;cooperation&lt;/b&gt;（合作）— coordination 强调安排和同步，cooperation 强调一起工作、互相帮助。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;concept-map&#x27;&gt;&lt;div class=&#x27;concept-center&#x27;&gt;coordination&lt;/div&gt;&lt;div class=&#x27;concept-nodes&#x27;&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;coordinate&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;coordinator&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;coordinated&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;uncoordinated&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;coordinative&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;coordination between departments&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;hand-eye coordination&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;coordination of efforts&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;lack of coordination&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;coordination meeting&lt;/span&gt;&lt;span class=&#x27;concept-node synonym&#x27;&gt;cooperation&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-output hidden&#x27;&gt;&lt;span class=&#x27;phase-tag output&#x27;&gt;再输出&lt;/span&gt;&lt;p class=&#x27;out-q&#x27;&gt;把 coordination 填回句子：&lt;/p&gt;&lt;p class=&#x27;out-sentence&#x27;&gt;Good ______ between the marketing and sales teams is essential for the product launch.&lt;/p&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out10&#x27; value=&#x27;coordination&#x27;&gt; coordination&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out10&#x27; value=&#x27;clumsy&#x27;&gt; clumsy&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out10&#x27; value=&#x27;awkward&#x27;&gt; awkward&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out10&#x27; value=&#x27;anxiety&#x27;&gt; anxiety&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;hidden out-fb&#x27;&gt;&lt;p class=&#x27;fb-line fb-ok&#x27;&gt;✓ 正确答案：&lt;b&gt;coordination&lt;/b&gt; UK /kəuˌɔːdɪ&amp;#x27;neɪʃn/ US /ko,ɔrdɪ&amp;#x27;neʃən/&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;📝 完整句：Good coordination between the marketing and sales teams is essential for the product launch.&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;🀄 译文：市场部和销售部之间的良好协调对产品发布至关重要。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wcard review&#x27; data-block=&#x27;words&#x27; data-card=&#x27;11&#x27; data-word=&#x27;backward&#x27;&gt;&lt;div class=&#x27;wcard-top&#x27;&gt;&lt;span class=&#x27;wtag review&#x27;&gt;复习&lt;/span&gt;&lt;span class=&#x27;wnum&#x27;&gt;11 / 12&lt;/span&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-think&#x27;&gt;&lt;span class=&#x27;phase-tag think&#x27;&gt;先思考&lt;/span&gt;&lt;p class=&#x27;think-q&#x27;&gt;看中文，先在心里回忆 / 试着读出来：&lt;/p&gt;&lt;p class=&#x27;meaning&#x27;&gt;向后；倒退的；落后的&lt;/p&gt;&lt;div class=&#x27;rbtns&#x27;&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;1&#x27; class=&#x27;rate&#x27;&gt;忘了&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;3&#x27; class=&#x27;rate&#x27;&gt;模糊&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;4&#x27; class=&#x27;rate&#x27;&gt;想起&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;5&#x27; class=&#x27;rate&#x27;&gt;熟练&lt;/button&gt;&lt;/div&gt;&lt;p class=&#x27;rate-msg&#x27;&gt;&lt;/p&gt;&lt;p class=&#x27;hint&#x27;&gt;评分 = 揭晓答案 + 展开输入内容&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-input hidden&#x27;&gt;&lt;span class=&#x27;phase-tag input&#x27;&gt;再输入&lt;/span&gt;&lt;div class=&#x27;hero-area&#x27;&gt;&lt;div class=&#x27;hero-info&#x27;&gt;&lt;p class=&#x27;hero-word&#x27;&gt;&lt;span class=&#x27;morph-part morph-root&#x27;&gt;back&lt;/span&gt;&lt;span class=&#x27;morph-part morph-suffix&#x27;&gt;ward&lt;/span&gt;&lt;/p&gt;&lt;p class=&#x27;hero-phon&#x27;&gt;&lt;span class=&#x27;hero-pos&#x27;&gt;adv./adj.&lt;/span&gt;UK /bækwəd/ US /bækwɚd/ &lt;audio controls preload=&#x27;none&#x27; src=&#x27;output/Day_129/audio/backward_en.mp3&#x27;&gt;&lt;source src=&#x27;output/Day_129/audio/backward_en.m4a&#x27;&gt;&lt;/audio&gt;&lt;/p&gt;&lt;p class=&#x27;hero-meaning&#x27;&gt;向后；倒退的；落后的&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;hero-img&#x27;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;ans-box&#x27;&gt;&lt;div class=&#x27;rich&#x27;&gt;&lt;div class=&#x27;rich-sec sec-etym&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;📖 词根拆解&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;来自中古英语 bakward，由 bak（back，背部/后面）和 -ward（朝向……方向）组合而成。古英语中已有 bæc（背部）和 weard（朝向）的用法，后来合并为表示“朝向后面”的副词。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-memory&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🧠 记忆法&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;词根拆分法：back（后面）+ ward（方向）= 朝向后面 → 向后。&lt;/li&gt;&lt;li&gt;场景联想法：想象你正在倒车，车子向后（backward）移动，后视镜里看到路标越来越远。&lt;/li&gt;&lt;li&gt;对比记忆法：对比 forward（向前），backward 就是它的反义词，记住 forward 就能记住 backward。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-usage&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;💡 用法&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;作副词时通常放在动词后（如 move backward），作形容词时放在名词前（如 backward step）。注意 backward 和 backwards 可互换，但美式英语更常用 backward。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-error&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;⚠️ 易错点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;He walked backwardly.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ He walked backward.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;backward 本身已是副词，不需要加 -ly。&lt;/div&gt;&lt;/li&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;The country is backward in technology.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ The country is backward in technology.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;此句正确，但注意 backward 作形容词时没有比较级形式，不能说 more backward。&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-exam&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🎯 考点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;完形填空：常考 backward 与 forward 的对比，注意上下文方向提示。&lt;/li&gt;&lt;li&gt;写作：可用 backward 描述技术或社会发展的滞后，如 &amp;#x27;The region remains backward in education.&amp;#x27;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-family&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🌳 词族&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;backwards&lt;/b&gt; adv. 向后地&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;backwardness&lt;/b&gt; n. 落后；倒退&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;forward&lt;/b&gt; adv./adj. 向前；先进的&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;back&lt;/b&gt; n./adv./adj. 背部；向后；后面的&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-colloc&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔗 常见搭配&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;backward step&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;后退的一步&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;backward glance&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;向后一瞥&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;backward country&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;落后国家&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;backward and forward&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;来回地&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-example&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;✏️ 真实例句&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;The car suddenly moved &lt;mark class=&#x27;target&#x27;&gt;backward&lt;/mark&gt; and hit the wall.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;那辆车突然向后移动，撞上了墙。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;In some regions, technology is still &lt;mark class=&#x27;target&#x27;&gt;backward&lt;/mark&gt; compared to the rest of the world.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;在一些地区，技术相比世界其他地区仍然落后。&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-confuse&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔍 近义辨析&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;b&gt;backwards&lt;/b&gt;（向后地）— backward 和 backwards 意思相同，但 backward 更常用于形容词，backwards 更常用于副词，尤其在英式英语中。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;concept-map&#x27;&gt;&lt;div class=&#x27;concept-center&#x27;&gt;backward&lt;/div&gt;&lt;div class=&#x27;concept-nodes&#x27;&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;backwards&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;backwardness&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;forward&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;back&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;backward step&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;backward glance&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;backward country&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;backward and forward&lt;/span&gt;&lt;span class=&#x27;concept-node synonym&#x27;&gt;backwards&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-output hidden&#x27;&gt;&lt;span class=&#x27;phase-tag output&#x27;&gt;再输出&lt;/span&gt;&lt;p class=&#x27;out-q&#x27;&gt;把 backward 填回句子：&lt;/p&gt;&lt;p class=&#x27;out-sentence&#x27;&gt;The car suddenly moved ______ and hit the wall.&lt;/p&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out11&#x27; value=&#x27;backward&#x27;&gt; backward&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out11&#x27; value=&#x27;awkward&#x27;&gt; awkward&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out11&#x27; value=&#x27;anxiety&#x27;&gt; anxiety&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out11&#x27; value=&#x27;clumsy&#x27;&gt; clumsy&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;hidden out-fb&#x27;&gt;&lt;p class=&#x27;fb-line fb-ok&#x27;&gt;✓ 正确答案：&lt;b&gt;backward&lt;/b&gt; UK /bækwəd/ US /bækwɚd/&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;📝 完整句：The car suddenly moved backward and hit the wall.&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;🀄 译文：那辆车突然向后移动，撞上了墙。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wcard review&#x27; data-block=&#x27;words&#x27; data-card=&#x27;12&#x27; data-word=&#x27;charter&#x27;&gt;&lt;div class=&#x27;wcard-top&#x27;&gt;&lt;span class=&#x27;wtag review&#x27;&gt;复习&lt;/span&gt;&lt;span class=&#x27;wnum&#x27;&gt;12 / 12&lt;/span&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-think&#x27;&gt;&lt;span class=&#x27;phase-tag think&#x27;&gt;先思考&lt;/span&gt;&lt;p class=&#x27;think-q&#x27;&gt;看中文，先在心里回忆 / 试着读出来：&lt;/p&gt;&lt;p class=&#x27;meaning&#x27;&gt;宪章；特许状&lt;/p&gt;&lt;div class=&#x27;rbtns&#x27;&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;1&#x27; class=&#x27;rate&#x27;&gt;忘了&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;3&#x27; class=&#x27;rate&#x27;&gt;模糊&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;4&#x27; class=&#x27;rate&#x27;&gt;想起&lt;/button&gt;&lt;button type=&#x27;button&#x27; data-q=&#x27;5&#x27; class=&#x27;rate&#x27;&gt;熟练&lt;/button&gt;&lt;/div&gt;&lt;p class=&#x27;rate-msg&#x27;&gt;&lt;/p&gt;&lt;p class=&#x27;hint&#x27;&gt;评分 = 揭晓答案 + 展开输入内容&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-input hidden&#x27;&gt;&lt;span class=&#x27;phase-tag input&#x27;&gt;再输入&lt;/span&gt;&lt;div class=&#x27;hero-area&#x27;&gt;&lt;div class=&#x27;hero-info&#x27;&gt;&lt;p class=&#x27;hero-word&#x27;&gt;&lt;span class=&#x27;morph-part morph-root&#x27;&gt;charter&lt;/span&gt;&lt;/p&gt;&lt;p class=&#x27;hero-phon&#x27;&gt;&lt;span class=&#x27;hero-pos&#x27;&gt;n.&lt;/span&gt;UK /tʃɑːtə/ US /tʃɑrtɚ/ &lt;audio controls preload=&#x27;none&#x27; src=&#x27;output/Day_129/audio/charter_en.mp3&#x27;&gt;&lt;source src=&#x27;output/Day_129/audio/charter_en.m4a&#x27;&gt;&lt;/audio&gt;&lt;/p&gt;&lt;p class=&#x27;hero-meaning&#x27;&gt;宪章；特许状&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;hero-img&#x27;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;ans-box&#x27;&gt;&lt;div class=&#x27;rich&#x27;&gt;&lt;div class=&#x27;rich-sec sec-etym&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;📖 词根拆解&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;来自古法语 chartre，源自拉丁语 chartula，意为“小纸片”，是 charta（纸）的指小形式。最初指写有法律条款的纸张，后引申为“特许状”和“宪章”。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-memory&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🧠 记忆法&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;词源故事法：想象一张小小的纸片（chartula）上写着国王的印章，这就是特许状，赋予城市或公司特殊权利。&lt;/li&gt;&lt;li&gt;场景联想法：你创办了一家公司，需要一张“特许状”（charter）才能合法运营，这张纸就是你的“通行证”。&lt;/li&gt;&lt;li&gt;对比记忆法：charter（宪章）和 chapter（章节）拼写相似，但 charter 是“特许状”，chapter 是“书的一章”，可以联想：宪章是历史的重要章节。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-usage&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;💡 用法&lt;/div&gt;&lt;p class=&#x27;sec-body&#x27;&gt;作名词时，常指正式文件，如城市宪章、公司特许状；作动词时，意为“包租（船、飞机等）”。&lt;/p&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-error&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;⚠️ 易错点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li class=&#x27;err-pair&#x27;&gt;&lt;div class=&#x27;err-wrong&#x27;&gt;❌ &lt;s&gt;The company has a charter to operate in this area.&lt;/s&gt;&lt;/div&gt;&lt;div class=&#x27;err-right&#x27;&gt;✅ The company has a charter to operate in this area.&lt;/div&gt;&lt;div class=&#x27;err-note&#x27;&gt;charter 作名词时，常与不定式搭配，表示“做某事的特许权”。&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-exam&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🎯 考点&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;完形填空：常考 charter 与 chapter 的拼写辨析。&lt;/li&gt;&lt;li&gt;阅读：在历史或法律类文章中，charter 常作为关键词出现，需理解其“特许状”含义。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-family&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🌳 词族&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;chartered&lt;/b&gt; adj. 特许的；包租的&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;charterer&lt;/b&gt; n. 租船人；包租者&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;chartering&lt;/b&gt; n. 包租；特许&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-colloc&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔗 常见搭配&lt;/div&gt;&lt;div class=&#x27;chips&#x27;&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;royal charter&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;皇家特许状&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;charter school&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;特许学校&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;charter flight&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;包机&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;charter member&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;创始成员&lt;/span&gt;&lt;/span&gt;&lt;span class=&#x27;chip&#x27;&gt;&lt;b&gt;draft a charter&lt;/b&gt; &lt;span class=&#x27;chip-zh&#x27;&gt;起草宪章&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-example&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;✏️ 真实例句&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;The city&amp;#x27;s &lt;mark class=&#x27;target&#x27;&gt;charter&lt;/mark&gt; was granted by the king in 1215.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;这座城市的特许状是由国王在1215年授予的。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&#x27;en&#x27;&gt;They &lt;mark class=&#x27;target&#x27;&gt;chartered&lt;/mark&gt; a private jet to fly to the conference.&lt;/span&gt;&lt;br&gt;&lt;span class=&#x27;zh&#x27;&gt;他们包租了一架私人飞机去参加会议。&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&#x27;rich-sec sec-confuse&#x27;&gt;&lt;div class=&#x27;sec-title&#x27;&gt;🔍 近义辨析&lt;/div&gt;&lt;ul class=&#x27;sec-list&#x27;&gt;&lt;li&gt;&lt;b&gt;constitution&lt;/b&gt;（宪法）— charter 指特定组织或城市的特许文件，constitution 指国家或组织的根本大法，范围更广。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;concept-map&#x27;&gt;&lt;div class=&#x27;concept-center&#x27;&gt;charter&lt;/div&gt;&lt;div class=&#x27;concept-nodes&#x27;&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;chartered&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;charterer&lt;/span&gt;&lt;span class=&#x27;concept-node family&#x27;&gt;chartering&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;royal charter&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;charter school&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;charter flight&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;charter member&lt;/span&gt;&lt;span class=&#x27;concept-node colloc&#x27;&gt;draft a charter&lt;/span&gt;&lt;span class=&#x27;concept-node synonym&#x27;&gt;constitution&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&#x27;phase phase-output hidden&#x27;&gt;&lt;span class=&#x27;phase-tag output&#x27;&gt;再输出&lt;/span&gt;&lt;p class=&#x27;out-q&#x27;&gt;把 charter 填回句子：&lt;/p&gt;&lt;p class=&#x27;out-sentence&#x27;&gt;The city&amp;amp;#x27;s ______ was granted by the king in 1215.&lt;/p&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out12&#x27; value=&#x27;awkward&#x27;&gt; awkward&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out12&#x27; value=&#x27;anxiety&#x27;&gt; anxiety&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out12&#x27; value=&#x27;charter&#x27;&gt; charter&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;out12&#x27; value=&#x27;clumsy&#x27;&gt; clumsy&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;hidden out-fb&#x27;&gt;&lt;p class=&#x27;fb-line fb-ok&#x27;&gt;✓ 正确答案：&lt;b&gt;charter&lt;/b&gt; UK /tʃɑːtə/ US /tʃɑrtɚ/&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;📝 完整句：The city&amp;#x27;s charter was granted by the king in 1215.&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;🀄 译文：这座城市的特许状是由国王在1215年授予的。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wf-card&#x27; data-block=&#x27;word_forms&#x27; data-card=&#x27;1&#x27; data-answer=&#x27;anxious&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;&amp;#36716;&amp;#183;01&lt;/span&gt;&lt;b&gt;&amp;#35789;&amp;#24615;&amp;#36716;&amp;#21270;&lt;/b&gt; &amp;#183; &lt;span class=&#x27;wf-word&#x27;&gt;anxiety&lt;/span&gt;&lt;/div&gt;&lt;p class=&#x27;prompt&#x27;&gt;选词填空，注意词性转化：&lt;/p&gt;&lt;div class=&#x27;wf-stem&#x27;&gt;She was very _____ about the test result.&lt;/div&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf1&#x27; value=&#x27;anxiety&#x27;&gt; anxiety&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf1&#x27; value=&#x27;anxious&#x27;&gt; anxious&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf1&#x27; value=&#x27;anxiously&#x27;&gt; anxiously&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf1&#x27; value=&#x27;anxiousness&#x27;&gt; anxiousness&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;feedback hidden&#x27; data-answer=&#x27;anxious&#x27;&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128204; &lt;b&gt;&amp;#31572;&amp;#26696;&amp;#65306;&lt;/b&gt;anxious &amp;#8212; 焦虑的；担心的&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127992; &lt;b&gt;题干翻译：&lt;/b&gt;她对考试成绩非常_____。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128214; &lt;b&gt;完整句翻译：&lt;/b&gt;她对考试成绩非常anxious。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128221; &lt;b&gt;完整句：&lt;/b&gt;She was very anxious about the test result.&lt;/p&gt;&lt;div class=&#x27;think-path&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#128300; 解题思路&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;① 确定句子空缺处需要什么词性（主语/谓语/宾语/定语/状语）。&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;② 原词 &lt;b&gt;anxiety&lt;/b&gt;（焦虑；忧虑）需要转化为 &lt;b&gt;anxious&lt;/b&gt; 形式。名词 -&amp;gt; 形容词（-ous 后缀）&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;③ 将 &lt;b&gt;anxious&lt;/b&gt; 代入原句，检查语法和语义是否通顺。&lt;/p&gt;&lt;/div&gt;名词 -&amp;gt; 形容词（-ous 后缀）&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127919; &lt;b&gt;考点：&lt;/b&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;anxiety&lt;/b&gt;：焦虑
