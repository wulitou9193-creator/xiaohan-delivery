lt;input type=&#x27;radio&#x27; name=&#x27;wf3&#x27; value=&#x27;clumsy&#x27;&gt; clumsy&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf3&#x27; value=&#x27;clumsily&#x27;&gt; clumsily&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf3&#x27; value=&#x27;clumsiness&#x27;&gt; clumsiness&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf3&#x27; value=&#x27;clumsier&#x27;&gt; clumsier&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;feedback hidden&#x27; data-answer=&#x27;clumsily&#x27;&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128204; &lt;b&gt;&amp;#31572;&amp;#26696;&amp;#65306;&lt;/b&gt;clumsily &amp;#8212; &lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127992; &lt;b&gt;题干翻译：&lt;/b&gt;他道歉得如此_____，以至于更加冒犯了她。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128214; &lt;b&gt;完整句翻译：&lt;/b&gt;他道歉得如此clumsily，以至于更加冒犯了她。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128221; &lt;b&gt;完整句：&lt;/b&gt;He apologized so clumsily that he offended her even more.&lt;/p&gt;&lt;div class=&#x27;think-path&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#128300; 解题思路&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;① 确定句子空缺处需要什么词性（主语/谓语/宾语/定语/状语）。&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;② 原词 &lt;b&gt;clumsy&lt;/b&gt;（笨拙的；不灵巧的；不圆滑的）需要转化为 &lt;b&gt;clumsily&lt;/b&gt; 形式。形容词 -&amp;gt; 副词（-ly 后缀）&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;③ 将 &lt;b&gt;clumsily&lt;/b&gt; 代入原句，检查语法和语义是否通顺。&lt;/p&gt;&lt;/div&gt;形容词 -&amp;gt; 副词（-ly 后缀）&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127919; &lt;b&gt;考点：&lt;/b&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;clumsy&lt;/b&gt;：笨拙的；不灵巧的；不圆滑的&lt;span class=&#x27;opt-reason&#x27;&gt;这是原形，需要派生形式&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;clumsily&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt; — 答案&lt;/span&gt; &lt;span class=&quot;tag-correct&quot;&gt;&amp;#10003;&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;clumsiness&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;这是复数形式，此处需要单数/其他形式&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;clumsier&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;需要副词形式（-ly）&lt;/span&gt;&lt;/li&gt;&lt;br&gt;&amp;#128218; &lt;b&gt;题目来源：&lt;/b&gt;CET-4 / 考研英语 词性转化专项练习&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128270; &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;div class=&#x27;distractors&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#9888; 干扰项分析&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;clumsy&lt;/b&gt;（笨拙的；不灵巧的；不圆滑的）：这是原形，需要派生形式&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;clumsiness&lt;/b&gt;（）：这是复数形式，此处需要单数/其他形式&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;clumsier&lt;/b&gt;（）：需要副词形式（-ly）&lt;/p&gt;&lt;/div&gt;&lt;/ul&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128161; &lt;b&gt;解析：&lt;/b&gt;句子需要副词修饰动词 apologized，clumsily 是副词形式，意为‘笨拙地’；clumsy 是形容词，clumsiness 是名词，clumsier 是比较级形容词。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wf-card&#x27; data-block=&#x27;word_forms&#x27; data-card=&#x27;4&#x27; data-answer=&#x27;despair&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;&amp;#36716;&amp;#183;04&lt;/span&gt;&lt;b&gt;&amp;#35789;&amp;#24615;&amp;#36716;&amp;#21270;&lt;/b&gt; &amp;#183; &lt;span class=&#x27;wf-word&#x27;&gt;despair&lt;/span&gt;&lt;/div&gt;&lt;p class=&#x27;prompt&#x27;&gt;选词填空，注意词性转化：&lt;/p&gt;&lt;div class=&#x27;wf-stem&#x27;&gt;The patient&amp;#x27;s condition left the doctors in _____.&lt;/div&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf4&#x27; value=&#x27;despair&#x27;&gt; despair&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf4&#x27; value=&#x27;desperate&#x27;&gt; desperate&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf4&#x27; value=&#x27;despairing&#x27;&gt; despairing&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf4&#x27; value=&#x27;desperation&#x27;&gt; desperation&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;feedback hidden&#x27; data-answer=&#x27;despair&#x27;&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128204; &lt;b&gt;&amp;#31572;&amp;#26696;&amp;#65306;&lt;/b&gt;despair &amp;#8212; 绝望，完全失去希望的状态。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127992; &lt;b&gt;题干翻译：&lt;/b&gt;病人的情况让医生们陷入了_____。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128214; &lt;b&gt;完整句翻译：&lt;/b&gt;病人的情况让医生们陷入了despair。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128221; &lt;b&gt;完整句：&lt;/b&gt;The patient&amp;amp;#x27;s condition left the doctors in despair.&lt;/p&gt;&lt;div class=&#x27;think-path&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#128300; 解题思路&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;题目中给出的词 &lt;b&gt;despair&lt;/b&gt; 已经符合句子的词性要求，不需要额外的词形变化。直接填入原形即可。&lt;/p&gt;&lt;/div&gt;词形不变，保持原形&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127919; &lt;b&gt;考点：&lt;/b&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;despair&lt;/b&gt;：绝望，完全失去希望的状态。&lt;span class=&#x27;opt-reason&#x27;&gt; — 答案&lt;/span&gt; &lt;span class=&quot;tag-correct&quot;&gt;&amp;#10003;&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;desperate&lt;/b&gt;：绝望的；不顾一切的&lt;span class=&#x27;opt-reason&#x27;&gt;词性/形式不匹配&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;despairing&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;这是现在分词形式，此处需要名词/形容词&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;desperation&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;词性/形式不匹配&lt;/span&gt;&lt;/li&gt;&lt;br&gt;&amp;#128218; &lt;b&gt;题目来源：&lt;/b&gt;CET-4 / 考研英语 词性转化专项练习&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128270; &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;div class=&#x27;distractors&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#9888; 干扰项分析&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;desperate&lt;/b&gt;（绝望的；不顾一切的）：词性/形式不匹配&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;despairing&lt;/b&gt;（）：这是现在分词形式，此处需要名词/形容词&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;desperation&lt;/b&gt;（）：词性/形式不匹配&lt;/p&gt;&lt;/div&gt;&lt;/ul&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128161; &lt;b&gt;解析：&lt;/b&gt;in despair 是固定搭配，表示“在绝望中”。desperate 是形容词，不能放在介词后；despairing 也是形容词；desperation 虽然也是名词，但 in desperation 更强调“拼命地”，与语境不符。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wf-card&#x27; data-block=&#x27;word_forms&#x27; data-card=&#x27;5&#x27; data-answer=&#x27;distressed&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;&amp;#36716;&amp;#183;05&lt;/span&gt;&lt;b&gt;&amp;#35789;&amp;#24615;&amp;#36716;&amp;#21270;&lt;/b&gt; &amp;#183; &lt;span class=&#x27;wf-word&#x27;&gt;distress&lt;/span&gt;&lt;/div&gt;&lt;p class=&#x27;prompt&#x27;&gt;选词填空，注意词性转化：&lt;/p&gt;&lt;div class=&#x27;wf-stem&#x27;&gt;The family was deeply _____ by the sudden loss of their home.&lt;/div&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf5&#x27; value=&#x27;distress&#x27;&gt; distress&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf5&#x27; value=&#x27;distressed&#x27;&gt; distressed&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf5&#x27; value=&#x27;distressing&#x27;&gt; distressing&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf5&#x27; value=&#x27;distressingly&#x27;&gt; distressingly&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;feedback hidden&#x27; data-answer=&#x27;distressed&#x27;&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128204; &lt;b&gt;&amp;#31572;&amp;#26696;&amp;#65306;&lt;/b&gt;distressed &amp;#8212; &lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127992; &lt;b&gt;题干翻译：&lt;/b&gt;这个家庭因突然失去家园而深感_____。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128214; &lt;b&gt;完整句翻译：&lt;/b&gt;这个家庭因突然失去家园而深感distressed。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128221; &lt;b&gt;完整句：&lt;/b&gt;The family was deeply distressed by the sudden loss of their home.&lt;/p&gt;&lt;div class=&#x27;think-path&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#128300; 解题思路&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;① 确定句子空缺处需要什么词性（主语/谓语/宾语/定语/状语）。&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;② 原词 &lt;b&gt;distress&lt;/b&gt;（（精神或身体上的）痛苦、悲痛、危难）需要转化为 &lt;b&gt;distressed&lt;/b&gt; 形式。词性转化&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;③ 将 &lt;b&gt;distressed&lt;/b&gt; 代入原句，检查语法和语义是否通顺。&lt;/p&gt;&lt;/div&gt;词性转化&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127919; &lt;b&gt;考点：&lt;/b&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;distress&lt;/b&gt;：（精神或身体上的）痛苦、悲痛、危难&lt;span class=&#x27;opt-reason&#x27;&gt;这是原形，需要派生形式&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;distressed&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt; — 答案&lt;/span&gt; &lt;span class=&quot;tag-correct&quot;&gt;&amp;#10003;&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;distressing&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;这是现在分词形式，此处需要名词/形容词&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;distressingly&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;词性/形式不匹配&lt;/span&gt;&lt;/li&gt;&lt;br&gt;&amp;#128218; &lt;b&gt;题目来源：&lt;/b&gt;CET-4 / 考研英语 词性转化专项练习&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128270; &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;div class=&#x27;distractors&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#9888; 干扰项分析&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;distress&lt;/b&gt;（（精神或身体上的）痛苦、悲痛、危难）：这是原形，需要派生形式&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;distressing&lt;/b&gt;（）：这是现在分词形式，此处需要名词/形容词&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;distressingly&lt;/b&gt;（）：词性/形式不匹配&lt;/p&gt;&lt;/div&gt;&lt;/ul&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128161; &lt;b&gt;解析：&lt;/b&gt;这里需要形容词作表语，distressed 表示“感到痛苦的”；distress 是名词/动词，distressing 是“令人痛苦的”，distressingly 是副词。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wf-card&#x27; data-block=&#x27;word_forms&#x27; data-card=&#x27;6&#x27; data-answer=&#x27;disturbed&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;&amp;#36716;&amp;#183;06&lt;/span&gt;&lt;b&gt;&amp;#35789;&amp;#24615;&amp;#36716;&amp;#21270;&lt;/b&gt; &amp;#183; &lt;span class=&#x27;wf-word&#x27;&gt;disturbing&lt;/span&gt;&lt;/div&gt;&lt;p class=&#x27;prompt&#x27;&gt;选词填空，注意词性转化：&lt;/p&gt;&lt;div class=&#x27;wf-stem&#x27;&gt;The loud noise outside _____ my concentration.&lt;/div&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf6&#x27; value=&#x27;disturbed&#x27;&gt; disturbed&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf6&#x27; value=&#x27;disturbing&#x27;&gt; disturbing&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf6&#x27; value=&#x27;disturbance&#x27;&gt; disturbance&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf6&#x27; value=&#x27;undisturbed&#x27;&gt; undisturbed&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;feedback hidden&#x27; data-answer=&#x27;disturbed&#x27;&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128204; &lt;b&gt;&amp;#31572;&amp;#26696;&amp;#65306;&lt;/b&gt;disturbed &amp;#8212; &lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127992; &lt;b&gt;题干翻译：&lt;/b&gt;外面巨大的噪音_____了我的注意力。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128214; &lt;b&gt;完整句翻译：&lt;/b&gt;外面巨大的噪音disturbed了我的注意力。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128221; &lt;b&gt;完整句：&lt;/b&gt;The loud noise outside disturbed my concentration.&lt;/p&gt;&lt;div class=&#x27;think-path&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#128300; 解题思路&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;① 确定句子空缺处需要什么词性（主语/谓语/宾语/定语/状语）。&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;② 原词 &lt;b&gt;disturbing&lt;/b&gt;（扰人的；引起不安的）需要转化为 &lt;b&gt;disturbed&lt;/b&gt; 形式。词性转化&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;③ 将 &lt;b&gt;disturbed&lt;/b&gt; 代入原句，检查语法和语义是否通顺。&lt;/p&gt;&lt;/div&gt;词性转化&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127919; &lt;b&gt;考点：&lt;/b&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;disturbed&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt; — 答案&lt;/span&gt; &lt;span class=&quot;tag-correct&quot;&gt;&amp;#10003;&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;disturbing&lt;/b&gt;：扰人的；引起不安的&lt;span class=&#x27;opt-reason&#x27;&gt;这是原形，需要派生形式&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;disturbance&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;词性/形式不匹配&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;undisturbed&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;词性/形式不匹配&lt;/span&gt;&lt;/li&gt;&lt;br&gt;&amp;#128218; &lt;b&gt;题目来源：&lt;/b&gt;CET-4 / 考研英语 词性转化专项练习&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128270; &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;div class=&#x27;distractors&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#9888; 干扰项分析&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;disturbing&lt;/b&gt;（扰人的；引起不安的）：这是原形，需要派生形式&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;disturbance&lt;/b&gt;（）：词性/形式不匹配&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;undisturbed&lt;/b&gt;（）：词性/形式不匹配&lt;/p&gt;&lt;/div&gt;&lt;/ul&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128161; &lt;b&gt;解析：&lt;/b&gt;句子缺少谓语动词，应使用过去式 disturbed；disturbing 是形容词，disturbance 是名词，undisturbed 是形容词。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wf-card&#x27; data-block=&#x27;word_forms&#x27; data-card=&#x27;7&#x27; data-answer=&#x27;dreadful&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;&amp;#36716;&amp;#183;07&lt;/span&gt;&lt;b&gt;&amp;#35789;&amp;#24615;&amp;#36716;&amp;#21270;&lt;/b&gt; &amp;#183; &lt;span class=&#x27;wf-word&#x27;&gt;dread&lt;/span&gt;&lt;/div&gt;&lt;p class=&#x27;prompt&#x27;&gt;选词填空，注意词性转化：&lt;/p&gt;&lt;div class=&#x27;wf-stem&#x27;&gt;The news was so _____ that she couldn&amp;#x27;t sleep all night.&lt;/div&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf7&#x27; value=&#x27;dread&#x27;&gt; dread&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27 &gt;dreadfully&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;需要形容词形式（-ful）&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;dreaded&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;这是过去式/过去分词，此处需要其他词性&lt;/span&gt;&lt;/li&gt;&lt;br&gt;&amp;#128218; &lt;b&gt;题目来源：&lt;/b&gt;CET-4 / 考研英语 词性转化专项练习&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128270; &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;div class=&#x27;distractors&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#9888; 干扰项分析&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;dread&lt;/b&gt;（恐惧；害怕；担忧）：这是原形，需要派生形式&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;dreadfully&lt;/b&gt;（）：需要形容词形式（-ful）&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;dreaded&lt;/b&gt;（）：这是过去式/过去分词，此处需要其他词性&lt;/p&gt;&lt;/div&gt;&lt;/ul&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128161; &lt;b&gt;解析：&lt;/b&gt;dreadful 是形容词，意为&amp;#x27;可怕的&amp;#x27;，修饰 news；dread 是动词/名词；dreadfully 是副词；dreaded 是形容词但常作定语，如 the dreaded day。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wf-card&#x27; data-block=&#x27;word_forms&#x27; data-card=&#x27;8&#x27; data-answer=&#x27;poison&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;&amp;#36716;&amp;#183;08&lt;/span&gt;&lt;b&gt;&amp;#35789;&amp;#24615;&amp;#36716;&amp;#21270;&lt;/b&gt; &amp;#183; &lt;span class=&#x27;wf-word&#x27;&gt;poisonous&lt;/span&gt;&lt;/div&gt;&lt;p class=&#x27;prompt&#x27;&gt;选词填空，注意词性转化：&lt;/p&gt;&lt;div class=&#x27;wf-stem&#x27;&gt;The plant contains a powerful _____ that can cause paralysis.&lt;/div&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf8&#x27; value=&#x27;poison&#x27;&gt; poison&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x t;：&lt;span class=&#x27;opt-reason&#x27;&gt;这是现在分词形式，此处需要名词/形容词&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;poisoner&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;词性/形式不匹配&lt;/span&gt;&lt;/li&gt;&lt;br&gt;&amp;#128218; &lt;b&gt;题目来源：&lt;/b&gt;CET-4 / 考研英语 词性转化专项练习&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128270; &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;div class=&#x27;distractors&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#9888; 干扰项分析&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;poisonous&lt;/b&gt;（有毒的，有害的）：这是原形，需要派生形式&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;poisoning&lt;/b&gt;（）：这是现在分词形式，此处需要名词/形容词&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;poisoner&lt;/b&gt;（）：词性/形式不匹配&lt;/p&gt;&lt;/div&gt;&lt;/ul&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128161; &lt;b&gt;解析：&lt;/b&gt;空格前有冠词 a 和形容词 powerful，需要名词。poison 是名词，意为“毒药”。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wf-card&#x27; data-block=&#x27;word_forms&#x27; data-card=&#x27;9&#x27; data-answer=&#x27;aware&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;&amp;#36716;&amp;#183;09&lt;/span&gt;&lt;b&gt;&amp;#35789;&amp;#24615;&amp;#36716;&amp;#21270;&lt;/b&gt; &amp;#183; &lt;span class=&#x27;wf-word&#x27;&gt;awareness&lt;/span&gt;&lt;/div&gt;&lt;p class=&#x27;prompt&#x27;&gt;选词填空，注意词性转化：&lt;/p&gt;&lt;div class=&#x27;wf-stem&#x27;&gt;Many people are not _____ of the health risks associated with a sedentary lifestyle.&lt;/div&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf9&#x27; value=&#x27;aware&#x27;&gt; aware&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf9&#x27; value=&#x27;awareness&#x27;&gt; awareness&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf9&#x27; value=&#x27;unaware&#x27;&gt; unaware&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf9&#x27; value=&#x27;awarenesses&#x27;&gt; awarenesses&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;feedback hidden&#x27; data-answer=&#x27;aware&#x27;&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128204; &lt;b&gt;&amp;#31572;&amp;#26696;&amp;#65306;&lt;/b&gt;aware &amp;#8212; 意识到的；知道的&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127992; &lt;b&gt;题干翻译：&lt;/b&gt;许多人没有意识到久坐不动的生活方式带来的健康风险。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128214; &lt;b&gt;完整句翻译：&lt;/b&gt;许多人没有意识到久坐不动的生活方式带来的健康风险。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128221; &lt;b&gt;完整句：&lt;/b&gt;Many people are not aware of the health risks associated with a sedentary lifestyle.&lt;/p&gt;&lt;div class=&#x27;think-path&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#128300; 解题思路&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;① 确定句子空缺处需要什么词性（主语/谓语/宾语/定语/状语）。&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;② 原词 &lt;b&gt;awareness&lt;/b&gt;（意识；察觉；认识）需要转化为 &lt;b&gt;aware&lt;/b&gt; 形式。词性转化&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;③ 将 &lt;b&gt;aware&lt;/b&gt; 代入原句，检查语法和语义是否通顺。&lt;/p&gt;&lt;/div&gt;词性转化&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127919; &lt;b&gt;考点：&lt;/b&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;aware&lt;/b&gt;：意识到的；知道的&lt;span class=&#x27;opt-reason&#x27;&gt; — 答案&lt;/span&gt; &lt;span class=&quot;tag-correct&quot;&gt;&amp;#10003;&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;awareness&lt;/b&gt;：意识；察觉；认识&lt;span class=&#x27;opt-reason&#x27;&gt;这是原形，需要派生形式&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;unaware&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;词性/形式不匹配&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;awarenesses&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;这是复数形式，此处需要单数/其他形式&lt;/span&gt;&lt;/li&gt;&lt;br&gt;&amp;#128218; &lt;b&gt;题目来源：&lt;/b&gt;CET-4 / 考研英语 词性转化专项练习&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128270; &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;div class=&#x27;distractors&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#9888; 干扰项分析&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;awareness&lt;/b&gt;（意识；察觉；认识）：这是原形，需要派生形式&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;unaware&lt;/b&gt;（）：词性/形式不匹配&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;awarenesses&lt;/b&gt;（）：这是复数形式，此处需要单数/其他形式&lt;/p&gt;&lt;/div&gt;&lt;/ul&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128161; &lt;b&gt;解析：&lt;/b&gt;be aware of 是固定搭配，表示“意识到”，这里需要形容词 aware。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wf-card&#x27; data-block=&#x27;word_forms&#x27; data-card=&#x27;10&#x27; data-answer=&#x27;coordinator&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;&amp;#36716;&amp;#183;10&lt;/span&gt;&lt;b&gt;&amp;#35789;&amp;#24615;&amp;#36716;&amp;#21270;&lt;/b&gt; &amp;#183; &lt;span class=&#x27;wf-word&#x27;&gt;coordination&lt;/span&gt;&lt;/div&gt;&lt;p class=&#x27;prompt&#x27;&gt;选词填空，注意词性转化：&lt;/p&gt;&lt;div class=&#x27;wf-stem&#x27;&gt;She was appointed as the project _____ to ensure smooth communication.&lt;/div&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf10&#x27; value=&#x27;coordination&#x27;&gt; coordination&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf10&#x27; value=&#x27;coordinator&#x27;&gt; coordinator&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf10&#x27; value=&#x27;coordinate&#x27;&gt; coordinate&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf10&#x27; value=&#x27;coordinated&#x27;&gt; coordinated&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;feedback hidden&#x27; data-answer=&#x27;coordinator&#x27;&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128204; &lt;b&gt;&amp;#31572;&amp;#26696;&amp;#65306;&lt;/b&gt;coordinator &amp;#8212; &lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127992; &lt;b&gt;题干翻译：&lt;/b&gt;她被任命为项目_____，以确保沟通顺畅。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128214; &lt;b&gt;完整句翻译：&lt;/b&gt;她被任命为项目coordinator，以确保沟通顺畅。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128221; &lt;b&gt;完整句：&lt;/b&gt;She was appointed as the project coordinator to ensure smooth communication.&lt;/p&gt;&lt;div class=&#x27;think-path&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#128300; 解题思路&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;① 确定句子空缺处需要什么词性（主语/谓语/宾语/定语/状语）。&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;② 原词 &lt;b&gt;coordination&lt;/b&gt;（协调；配合；协作）需要转化为 &lt;b&gt;coordinator&lt;/b&gt; 形式。词性转化&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;③ 将 &lt;b&gt;coordinator&lt;/b&gt; 代入原句，检查语法和语义是否通顺。&lt;/p&gt;&lt;/div&gt;词性转化&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127919; &lt;b&gt;考点：&lt;/b&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;coordination&lt;/b&gt;：协调；配合；协作&lt;span class=&#x27;opt-reason&#x27;&gt;这是原形，需要派生形式&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;coordinator&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt; — 答案&lt;/span&gt; &lt;span class=&quot;tag-correct&quot;&gt;&amp;#10003;&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;coordinate&lt;/b&gt;：使协调，调节&lt;span class=&#x27;opt-reason&#x27;&gt;词性/形式不匹配&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;coordinated&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;这是过去式/过去分词，此处需要其他词性&lt;/span&gt;&lt;/li&gt;&lt;br&gt;&amp;#128218; &lt;b&gt;题目来源：&lt;/b&gt;CET-4 / 考研英语 词性转化专项练习&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128270; &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;div class=&#x27;distractors&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#9888; 干扰项分析&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;coordination&lt;/b&gt;（协调；配合；协作）：这是原形，需要派生形式&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;coordinate&lt;/b&gt;（使协调，调节）：词性/形式不匹配&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;coordinated&lt;/b&gt;（）：这是过去式/过去分词，此处需要其他词性&lt;/p&gt;&lt;/div&gt;&lt;/ul&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128161; &lt;b&gt;解析：&lt;/b&gt;空处需要名词，指人，所以用 coordinator（协调员）。coordination 是抽象名词，coordinate 是动词，coordinated 是形容词。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wf-card&#x27; data-block=&#x27;word_forms&#x27; data-card=&#x27;11&#x27; data-answer=&#x27;backwardness&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;&amp;#36716;&amp;#183;11&lt;/span&gt;&lt;b&gt;&amp;#35789;&amp;#24615;&amp;#36716;&amp;#21270;&lt;/b&gt; &amp;#183; &lt;span class=&#x27;wf-word&#x27;&gt;backward&lt;/span&gt;&lt;/div&gt;&lt;p class=&#x27;prompt&#x27;&gt;选词填空，注意词性转化：&lt;/p&gt;&lt;div class=&#x27;wf-stem&#x27;&gt;The country&amp;#x27;s economic _____ is a major concern for the government.&lt;/div&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf11&#x27; value=&#x27;backward&#x27;&gt; backward&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf11&#x27; value=&#x27;backwards&#x27;&gt; backwards&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf11&#x27; value=&#x27;backwardness&#x27;&gt; backwardness&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf11&#x27; value=&#x27;back&#x27;&gt; back&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;feedback hidden&#x27; data-answer=&#x27;backwardness&#x27;&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128204; &lt;b&gt;&amp;#31572;&amp;#26696;&amp;#65306;&lt;/b&gt;backwardness &amp;#8212; &lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127992; &lt;b&gt;题干翻译：&lt;/b&gt;该国的经济_____是政府的主要担忧。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128214; &lt;b&gt;完整句翻译：&lt;/b&gt;该国的经济backwardness是政府的主要担忧。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128221; &lt;b&gt;完整句：&lt;/b&gt;The country&amp;amp;#x27;s economic backwardness is a major concern for the government.&lt;/p&gt;&lt;div class=&#x27;think-path&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#128300; 解题思路&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;① 确定句子空缺处需要什么词性（主语/谓语/宾语/定语/状语）。&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;② 原词 &lt;b&gt;backward&lt;/b&gt;（向后；倒退的；落后的）需要转化为 &lt;b&gt;backwardness&lt;/b&gt; 形式。形容词 -&amp;gt; 名词（-ness 后缀）&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;③ 将 &lt;b&gt;backwardness&lt;/b&gt; 代入原句，检查语法和语义是否通顺。&lt;/p&gt;&lt;/div&gt;形容词 -&amp;gt; 名词（-ness 后缀）&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127919; &lt;b&gt;考点：&lt;/b&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;backward&lt;/b&gt;：向后；倒退的；落后的&lt;span class=&#x27;opt-reason&#x27;&gt;这是原形，需要派生形式&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;backwards&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt;需要名词形式（-ness）&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;backwardness&lt;/b&gt;：&lt;span class=&#x27;opt-reason&#x27;&gt; — 答案&lt;/span&gt; &lt;span class=&quot;tag-correct&quot;&gt;&amp;#10003;&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;back&lt;/b&gt;：背后；回原处&lt;span class=&#x27;opt-reason&#x27;&gt;需要名词形式（-ness）&lt;/span&gt;&lt;/li&gt;&lt;br&gt;&amp;#128218; &lt;b&gt;题目来源：&lt;/b&gt;CET-4 / 考研英语 词性转化专项练习&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128270; &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;div class=&#x27;distractors&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#9888; 干扰项分析&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;backward&lt;/b&gt;（向后；倒退的；落后的）：这是原形，需要派生形式&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;backwards&lt;/b&gt;（）：需要名词形式（-ness）&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;back&lt;/b&gt;（背后；回原处）：需要名词形式（-ness）&lt;/p&gt;&lt;/div&gt;&lt;/ul&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128161; &lt;b&gt;解析：&lt;/b&gt;句子需要名词作主语，backwardness 是名词，意为“落后”；backward 是形容词/副词，backwards 是副词，back 是名词/副词/形容词。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q wf-card&#x27; data-block=&#x27;word_forms&#x27; data-card=&#x27;12&#x27; data-answer=&#x27;charter&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;&amp;#36716;&amp;#183;12&lt;/span&gt;&lt;b&gt;&amp;#35789;&amp;#24615;&amp;#36716;&amp;#21270;&lt;/b&gt; &amp;#183; &lt;span class=&#x27;wf-word&#x27;&gt;charter&lt;/span&gt;&lt;/div&gt;&lt;p class=&#x27;prompt&#x27;&gt;选词填空，注意词性转化：&lt;/p&gt;&lt;div class=&#x27;wf-stem&#x27;&gt;The university received a royal _____ in 1836.&lt;/div&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf12&#x27; value=&#x27;charter&#x27;&gt; charter&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf12&#x27; value=&#x27;chapter&#x27;&gt; chapter&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf12&#x27; value=&#x27;character&#x27;&gt; character&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;wf12&#x27; value=&#x27;chart&#x27;&gt; chart&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;feedback hidden&#x27; data-answer=&#x27;charter&#x27;&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128204; &lt;b&gt;&amp;#31572;&amp;#26696;&amp;#65306;&lt;/b&gt;charter &amp;#8212; 宪章；特许状&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127992; &lt;b&gt;题干翻译：&lt;/b&gt;这所大学在1836年获得了一份皇家_____。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128214; &lt;b&gt;完整句翻译：&lt;/b&gt;这所大学在1836年获得了一份皇家charter。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128221; &lt;b&gt;完整句：&lt;/b&gt;The university received a royal charter in 1836.&lt;/p&gt;&lt;div class=&#x27;think-path&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#128300; 解题思路&lt;/p&gt;&lt;p class=&#x27;think-step&#x27;&gt;题目中给出的词 &lt;b&gt;charter&lt;/b&gt; 已经符合句子的词性要求，不需要额外的词形变化。直接填入原形即可。&lt;/p&gt;&lt;/div&gt;词形不变，保持原形&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127919; &lt;b&gt;考点：&lt;/b&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;charter&lt;/b&gt;：宪章；特许状&lt;span class=&#x27;opt-reason&#x27;&gt; — 答案&lt;/span&gt; &lt;span class=&quot;tag-correct&quot;&gt;&amp;#10003;&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;chapter&lt;/b&gt;：章；回&lt;span class=&#x27;opt-reason&#x27;&gt;词性/形式不匹配&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;character&lt;/b&gt;：性格；角色&lt;span class=&#x27;opt-reason&#x27;&gt;词性/形式不匹配&lt;/span&gt;&lt;/li&gt;&lt;li class=&#x27;opt-explain&#x27;&gt;&lt;b&gt;chart&lt;/b&gt;：图表；海图&lt;span class=&#x27;opt-reason&#x27;&gt;需要名词形式（-er）&lt;/span&gt;&lt;/li&gt;&lt;br&gt;&amp;#128218; &lt;b&gt;题目来源：&lt;/b&gt;CET-4 / 考研英语 词性转化专项练习&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128270; &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;div class=&#x27;distractors&#x27;&gt;&lt;p class=&#x27;fb-line&#x27; style=&#x27;font-weight:700;font-size:16px;color:var(--navy);&#x27;&gt;&amp;#9888; 干扰项分析&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;chapter&lt;/b&gt;（章；回）：词性/形式不匹配&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;character&lt;/b&gt;（性格；角色）：词性/形式不匹配&lt;/p&gt;&lt;p class=&#x27;distractor-item&#x27;&gt;&lt;b&gt;chart&lt;/b&gt;（图表；海图）：需要名词形式（-er）&lt;/p&gt;&lt;/div&gt;&lt;/ul&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128161; &lt;b&gt;解析：&lt;/b&gt;charter 意为“特许状”，符合句意；chapter 是“章节”；character 是“性格”；chart 是“图表”。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q al-card&#x27; data-block=&#x27;article_logic&#x27; data-card=&#x27;0&#x27; data-answer=&#x27;anxiety&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;逻·0&lt;/span&gt;&lt;b&gt;文章逻辑 · 第 1 段&lt;/b&gt;&lt;/div&gt;&lt;p class=&#x27;prompt&#x27;&gt;Read the paragraph and choose the correct word to fill in the blank:&lt;/p&gt;&lt;div class=&#x27;para-sentence&#x27;&gt;Last Friday, I went on a blind date arranged by a friend. The moment I saw her, I felt a wave of &lt;span class=&#x27;para-blank&#x27;&gt;______&lt;/span&gt;. She was beautiful, but I was so clumsy that I spilled coffee on her dress. The silence that followed was awkward and disturbing.&lt;/div&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;al0&#x27; value=&#x27;anxiety&#x27;&gt; anxiety&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;al0&#x27; value=&#x27;despair&#x27;&gt; despair&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt #x27; name=&#x27;al2&#x27; value=&#x27;charter&#x27;&gt; charter&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;feedback hidden&#x27; data-answer=&#x27;backward&#x27;&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128204; &lt;b&gt;答案：&lt;/b&gt;backward — 向后；倒退的；落后的&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127992; &lt;b&gt;段落翻译（中文）：&lt;/b&gt;她笑了，说我的 &lt;span class=&#x27;tag-correct&#x27; style=&#x27;font-size:12px;padding:2px 6px;&#x27;&gt;backward&lt;/span&gt; 协调很可爱，我们 &lt;span class=&#x27;tag-correct&#x27; style=&#x27;font-size:12px;padding:2px 6px;&#x27;&gt;charter&lt;/span&gt; 了一艘船看日落。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128221; &lt;b&gt;完整句：&lt;/b&gt;她笑了，说我的 backward 协调很可爱，我们 charter 了一艘船看日落。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#127919; &lt;b&gt;考点：&lt;/b&gt;段落主旨理解 + 上下文逻辑推断&lt;br&gt;&amp;#128218; &lt;b&gt;题目来源：&lt;/b&gt;小韩英语角 · 读后理解练习&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;&amp;#128270; &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;li&gt;&lt;b&gt;backward&lt;/b&gt;：向后；倒退的；落后的 &lt;span class=&quot;tag-correct&quot;&gt;✓&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;awareness&lt;/b&gt;：意识；察觉；认识&lt;/li&gt;&lt;li&gt;&lt;b&gt;coordination&lt;/b&gt;：协调；配合；协作&lt;/li&gt;&lt;li&gt;&lt;b&gt;charter&lt;/b&gt;：宪章；特许状&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&#x27;q reading-card&#x27; data-block=&#x27;reading&#x27; data-card=&#x27;1&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;b&gt;③ 语境阅读&lt;/b&gt; &lt;span class=&#x27;hint-inline&#x27;&gt;&amp;#x1F50D; 点击任意词 = 查词义（&lt;span style=&#x27;color:#E85D3A;font-weight:700;&#x27;&gt;新词&lt;/span&gt; / &lt;span style=&#x27;color:#8B5CF6;font-weight:700;&#x27;&gt;复习&lt;/span&gt; / &lt;span style=&#x27;color:#6B7280;border-bottom:1px dashed #6B7280;&#x27;&gt;其他&lt;/span&gt;）&lt;/span&gt;&lt;/div&gt;&lt;p class=&#x27;story-title&#x27;&gt;情感与关系：一次尴尬的约会&lt;/p&gt;&lt;audio controls preload=&#x27;none&#x27; src=&#x27;output/Day_129/audio/story.mp3&#x27;&gt;&lt;source src=&#x27;output/Day_129/audio/story.m4a&#x27;&gt;&lt;/audio&gt;&lt;div class=&#x27;story-body&#x27;&gt;&lt;p class=&#x27;story-paragraph&#x27;&gt;Last Friday, I went on a blind date arranged by a friend. The moment I saw her, I felt a wave of &lt;span class=&#x27;dict-word dict-new&#x27; data-word=&#x27;anxiety&#x27;&gt;anxiety&lt;/span&gt;. She was beautiful, but I was so &lt;span class=&#x27;dict-word dict-new&#x27; data-word=&#x27;clumsy&#x27;&gt;clumsy&lt;/span&gt; that I spilled coffee on her dress. The silence that followed was &lt;span class=&#x27;dict-word dict-new&#x27; data-word=&#x27;awkward&#x27;&gt;awkward&lt;/span&gt; and &lt;span class=&#x27;dict-word dict-new&#x27; data-word=&#x27;disturbing&#x27;&gt;disturbing&lt;/span&gt;.&lt;/p&gt;&lt;p class=&#x27;story-paragraph&#x27;&gt;I tried to apologize, but my words only increased her &lt;span class=&#x27;dict-word dict-new&#x27; data-word=&#x27;distress&#x27;&gt;distress&lt;/span&gt;. She looked at me with &lt;span class=&#x27;dict-word dict-new&#x27; data-word=&#x27;despair&#x27;&gt;despair&lt;/span&gt;, as if the evening was ruined. I felt a &lt;span class=&#x27;dict-word dict-new&#x27; data-word=&#x27;dread&#x27;&gt;dread&lt;/span&gt; that I had made a &lt;span class=&#x27;dict-word dict-new&#x27; data-word=&#x27;poisonous&#x27;&gt;poisonous&lt;/span&gt; mistake. My &lt;span class=&#x27;dict-word dict-review&#x27; data-word=&#x27;awareness&#x27;&gt;awareness&lt;/span&gt; of the situation only made things worse.&lt;/p&gt;&lt;p class=&#x27;story-paragraph&#x27;&gt;To my surprise, she laughed. She said my &lt;span class=&#x27;dict-word dict-review&#x27; data-word=&#x27;backward&#x27;&gt;backward&lt;/span&gt; &lt;span class=&#x27;dict-word dict-review&#x27; data-word=&#x27;coordination&#x27;&gt;coordination&lt;/span&gt; was actually charming. We ended up &lt;span class=&#x27;dict-word dict-review&#x27; data-word=&#x27;charter&#x27;&gt;charter&lt;/span&gt;ing a boat for a sunset ride. The evening turned out to be wonderful.&lt;/p&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;中文梗概&lt;/summary&gt;&lt;p&gt;作者讲述了一次尴尬的相亲经历。一开始因为紧张和笨拙，他打翻了咖啡，导致气氛尴尬和令人不安。他感到绝望和恐惧，觉得自己犯了一个严重的错误。但对方却笑了，认为他的笨拙很可爱，最后他们一起租船看日落，结局很美好。&lt;/p&gt;&lt;/details&gt;&lt;p class=&#x27;muted&#x27;&gt;读完整篇 → 进入 ④ 输出挑战。&lt;/p&gt;&lt;/section&gt;&lt;section class=&#x27;q cloze&#x27; data-block=&#x27;output&#x27; data-card=&#x27;1&#x27; data-answer=&#x27;anxiety&#x27;&gt;&lt;div class=&#x27;qhead&#x27;&gt;&lt;span class=&#x27;qn&#x27;&gt;完·1&lt;/span&gt;&lt;b&gt;完形填空&lt;/b&gt;&lt;/div&gt;&lt;p class=&#x27;sentence&#x27;&gt;The moment I saw her, I felt a wave of ______.&lt;/p&gt;&lt;div class=&#x27;opts&#x27;&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;1&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;clo1&#x27; value=&#x27;anxiety&#x27;&gt; anxiety&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;clo1&#x27; value=&#x27;despair&#x27;&gt; despair&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;clo1&#x27; value=&#x27;distress&#x27;&gt; distress&lt;/label&gt;&lt;label class=&#x27;opt &#x27; data-correct=&#x27;0&#x27;&gt;&lt;input type=&#x27;radio&#x27; name=&#x27;clo1&#x27; value=&#x27;dread&#x27;&gt; dread&lt;/label&gt;&lt;/div&gt;&lt;div class=&#x27;feedback hidden&#x27; data-answer=&#x27;anxiety&#x27;&gt;&lt;p class=&#x27;fb-line&#x27;&gt;📌 &lt;b&gt;答案：&lt;/b&gt;anxiety — 焦虑；忧虑&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;📝 &lt;b&gt;完整句子：&lt;/b&gt;The moment I saw her, I felt a wave of ______.&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;💡 &lt;b&gt;考点：&lt;/b&gt;名词，表示焦虑，符合见到对方时的紧张情绪。&lt;/p&gt;&lt;p class=&#x27;fb-line&#x27;&gt;🔎 &lt;b&gt;选项辨析：&lt;/b&gt;&lt;/p&gt;&lt;ul class=&#x27;explain&#x27;&gt;&lt;li&gt;&lt;b&gt;anxiety&lt;/b&gt;：焦虑；忧虑 &lt;span class=&quot;tag-correct&quot;&gt;✓&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;despair&lt;/b&gt;：绝       b.classList.toggle(&#x27;on&#x27;, b.getAttribute(&#x27;data-block&#x27;) === c.getAttribute(&#x27;data-block&#x27;));
    });
    document.getElementById(&#x27;nav-pos&#x27;).textContent = (curIdx + 1) + &#x27; / &#x27; + cards.length;
    document.querySelectorAll(&#x27;.card-nav button&#x27;).forEach(function(b){
      var dir = b.getAttribute(&#x27;data-nav&#x27;);
      b.disabled = (dir === &#x27;prev&#x27; &amp;&amp; curIdx === 0) || (dir === &#x27;next&#x27; &amp;&amp; curIdx === cards.length - 1);
    });
    window.scrollTo(0, 0);
  }
  function navNext(){ if (curIdx &lt; cards.length - 1) showCard(cards[curIdx + 1]); }
  function navPrev(){ if (curIdx &gt; 0) showCard(cards[curIdx - 1]); }
  document.body.addEventListener(&#x27;click&#x27;, function(e){
    var t = e.target.closest(&#x27;[data-nav]&#x27;);
    if (!t) return;
    if (t.getAttribute(&#x27;data-nav&#x27;) === &#x27;next&#x27;) navNext(); else navPrev();
  });

  // 词卡：评分 → 揭晓输入 + 展开输出（含进度计数 / 离线兜底 / 自动完成）
  var ratings = {};  // word -&gt; quality（会话内）
  var wcards = Array.prototype.slice.call(document.querySelectorAll(&#x27;.wcard&#x27;));
  var ratedSet = {};  // word -&gt; true（含 localStorage 恢复）
  var LS_RATINGS = &#x27;xiaohan_ratings_&#x27; + DAY;
  var LS_PENDING = &#x27;xiaohan_pending_&#x27; + DAY;
  function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || &#x27;null&#x27;); } catch(e){ return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  var savedRatings = lsGet(LS_RATINGS) || {};
  Object.keys(savedRatings).forEach(function(w){
    if (savedRatings[w]) ratedSet[w] = true;
  });
  function ratedCount(){
    var n = 0;
    wcards.forEach(function(c){
      if (ratedSet[c.getAttribute(&#x27;data-word&#x27;)]) n++;
    });
    return n;
  }
  function refreshRateChip(){
    var chip = document.getElementById(&#x27;rate-chip&#x27;);
    if (!chip) return;
    var n = ratedCount(), total = wcards.length;
    chip.textContent = &#x27;词卡 &#x27; + n + &#x27;/&#x27; + total;
    chip.classList.toggle(&#x27;done&#x27;, n === total);
    if (n === total) chip.textContent += &#x27; · 学完&#x27;;
  }
  function showStudyDone(offlineOnly){
    var el = document.getElementById(&#x27;study-done&#x27;);
    if (!el) return;
    el.textContent = offlineOnly
      ? &#x27;🎉 今日词卡已全部评分（离线已存，联网后自动同步）&#x27;
      : &#x27;🎉 今日学习完成！&#x27;;
    el.classList.remove(&#x27;hidden&#x27;);
  }
  // 同步端点列表：依次尝试，任一成功即视为已同步。
  // 1) 同源相对路径（经本地服务页 http://127.0.0.1:8090/ 打开时）
  // 2) 本地服务绝对地址（从桌面 file:// 直接打开学习单时，跨源 CORS 推送）
  var SYNC_ENDPOINTS = [&#x27;/api/review&#x27;, &#x27;http://127.0.0.1:8090/api/review&#x27;];
  function postSync(path, body){
    var payload = {
      method: &#x27;POST&#x27;, headers: {&#x27;Content-Type&#x27;: &#x27;application/json&#x27;},
      body: JSON.stringify(body)
    };
    var chain = Promise.resolve(false);
    SYNC_ENDPOINTS.forEach(function(base){
      var url = (base.indexOf(&#x27;http&#x27;) === 0 ? base : &#x27;&#x27;);
      chain = chain.then(function(ok){
        if (ok) return true;
        return fetch(url + path, payload).then(function(resp){ return resp.ok; }, function(){ return false; });
      });
    });
    return chain;
  }
  function sendReview(word, q){
    return postSync(&#x27;/api/review&#x27;, {word: word, quality: q, channel: &#x27;study&#x27;, day_num: DAY});
  }
  function flushPending(){
    var pend = lsGet(LS_PENDING) || [];
    if (!pend.length) return Promise.resolve();
    var next = [];
    pend.forEach(function(p){ next.push({word: p.word, q: p.q}); });
    var queue = next.slice();
    return queue.reduce(function(acc, item){
      return acc.then(function(){ return sendReview(item.word, item.q); }).then(function(ok){
        if (!ok) return;
        var rest = [];
        pend.forEach(function(p){
          if (!(p.word === item.word &amp;&amp; p.q === item.q)) rest.push(p);
        });
        pend = rest;
        lsSet(LS_PENDING, pend);
      });
    }, Promise.resolve());
  }
  function maybeComplete(){
    flushPending().then(function(){
      return postSync(&#x27;/api/study-complete&#x27;, {day_num: DAY});
    }).then(function(ok){
      if (ok) showStudyDone(false); else showStudyDone(true);
    }).catch(function(){ showStudyDone(true); });
  }
  function rateWord(card, q){
    var word = card.getAttribute(&#x27;data-word&#x27;);
    ratings[word] = q;
    ratedSet[word] = true;
    var s = lsGet(LS_RATINGS) || {};
    s[word] = q;
    lsSet(LS_RATINGS, s);
    refreshRateChip();
    sendReview(word, q).then(function(ok){
      if (!ok) {
        var pend = lsGet(LS_PENDING) || [];
        pend.push({word: word, q: q});
        lsSet(LS_PENDING, pend);
      }
      if (ratedCount() &gt;= wcards.length) maybeComplete();
    });
  }
  document.querySelectorAll(&#x27;.wcard .rate&#x27;).forEach(function(btn){
    btn.addEventListener(&#x27;click&#x27;, function(){
      var q = parseInt(btn.getAttribute(&#x27;data-q&#x27;), 10);
      var card = btn.closest(&#x27;.wcard&#x27;);
      card.querySelectorAll(&#x27;.rate&#x27;).forEach(function(b){ b.classList.remove(&#x27;sel&#x27;); });
      btn.classList.add(&#x27;sel&#x27;);
      card.querySelector(&#x27;.phase-input&#x27;).classList.remove(&#x27;hidden&#x27;);
      card.querySelector(&#x27;.phase-output&#x27;).classList.remove(&#x27;hidden&#x27;);
      var labels = {1: &#x27;忘了&#x27;, 3: &#x27;模糊&#x27;, 4: &#x27;想起&#x27;, 5: &#x27;熟练&#x27;};
      card.querySelector(&#x27;.rate-msg&#x27;).textContent = &#x27;已记录「&#x27; + (labels[q] || q) + &#x27;」—— 答案和讲解展开啦&#x27;;
      rateWord(card, q);
    });
  });
  refreshRateChip();
  // 打开页面即自动补推历史遗留评分（避免漏同步）
  flushPending();

  // 词卡输出小练习：选完立刻反馈
  document.querySelectorAll(&#x27;.wcard .opts input&#x27;).forEach(function(r){
    r.addEventListener(&#x27;change&#x27;, function(){
      var card = r.closest(&#x27;.wcard&#x27;);
      var word = card.getAttribute(&#x27;data-word&#x27;);
      var ok = r.value === word;
      card.querySelectorAll(&#x27;label.opt&#x27;).forEach(function(l){
        l.classList.remove(&#x27;right&#x27;, &#x27;wrong&#x27;, &#x27;soft&#x27;);
        if (l.getAttribute(&#x27;data-correct&#x27;) === &#x27;1&#x27;) l.classList.add(&#x27;right&#x27;);
        else if (l.querySelector(&#x27;input&#x27;).checked) l.classList.add(&#x27;wrong&#x27;);
        else l.classList.add(&#x27;soft&#x27;);
      });
      var fb = card.querySelector(&#x27;.out-fb&#x27;);
      if (fb) fb.classList.remove(&#x27;hidden&#x27;);
    });
  });

  // 阅读点读词典 — 点击任意词访问小字典
  function showDict(word, info) {
    var audioHtml = info.au ? &quot;&lt;audio controls autoplay preload=&#x27;auto&#x27; src=&#x27;output/Day_129/audio/&quot; + info.au + &quot;.mp3&#x27;&gt;&lt;/audio&gt;&quot; : &#x27;&#x27;;
    var defHtml = &#x27;&#x27;;
    if (info.def) {
      defHtml = &quot;&lt;div class=&#x27;d-def&#x27;&gt;&quot; + info.def + &quot;&lt;/div&gt;&quot;;
    }
    document.getElementById(&#x27;dict-box&#x27;).innerHTML =
      &quot;&lt;div class=&#x27;d-en&#x27;&gt;&quot; + word + &quot;&lt;/div&gt;&quot; +
      &quot;&lt;div class=&#x27;d-ph&#x27;&gt;&quot; + (info.ph || &#x27;&#x27;) + &quot;&lt;/div&gt;&quot; +
      &quot;&lt;div class=&#x27;d-zh&#x27;&gt;&quot; + (info.zh || &#x27;&#x27;) + &quot;&lt;/div&gt;&quot; + defHtml +
      audioHtml;
    document.getElementById(&#x27;dict-modal&#x27;).classList.add(&#x27;show&#x27;);
  }

  // 已知词（当日目标词）的点击
  document.querySelectorAll(&#x27;.dict-word&#x27;).forEach(function(sw){
    sw.addEventListener(&#x27;click&#x27;, function(e){
      e.stopPropagation();
      var w = sw.getAttribute(&#x27;data-word&#x27;);
      var info = DICT[w] || {};
      showDict(w, info);
    });
  });

  // 任意词点击查询 — 通过在线词典 API
  document.querySelectorAll(&#x27;.story-paragraph, .story-body&#x27;).forEach(function(el){
    el.addEventListener(&#x27;click&#x27;, function(e){
      // 如果已经是 .dict-word 的点击，不要重复处理
      if (e.target.closest(&#x27;.dict-word&#x27;)) return;
      // 如果点击的是普通文本节点，获取选中的词
      var sel = window.getSelection();
      if (!sel || !sel.toString().trim()) {
        // 没有选中文字，尝试获取点击位置的词
        var t = e.target;
        if (t.nodeType === 3) { // Text node
          var text = t.textContent;
          var range = document.createRange();
          range.selectNodeContents(t);
          var pos = e.offsetX;
          // 简单处理：获取点击位置附近的词
          var words = text.match(/\w+/g) || [];
          if (words.length &gt; 0) {
            var word = words[Math.floor(words.length / 2)];
            lookupWord(word);
          }
          return;
        }
        return;
      }
      var word = sel.toString().trim().toLowerCase();
      if (word &amp;&amp; word.length &gt; 0 &amp;&amp; word.length &lt; 30) {
        lookupWord(word);
      }
      sel.removeAllRanges();
    });
  });

  function lookupWord(word) {
    // 先查本地词典
    var info = DICT[word];
    if (info) {
      showDict(word, info);
      return;
    }
    // 再尝试在线 API
    var apiUrl = &#x27;https://api.dictionaryapi.dev/api/v2/entries/en/&#x27; + encodeURIComponent(word);
    fetch(apiUrl)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (Array.isArray(data) &amp;&amp; data.length &gt; 0) {
          var entry = data[0];
          var ph = entry.phonetic || (entry.phonetics &amp;&amp; entry.phonetics[0] ? entry.phonetics[0].text : &#x27;&#x27;) || &#x27;&#x27;;
          var meanings = entry.meanings || [];
          var defs = [];
          meanings.forEach(function(m){
            (m.definitions || []).slice(0, 2).forEach(function(d){
              defs.push(&#x27;&lt;span class=&quot;d-pos&quot;&gt;&#x27; + (m.partOfSpeech || &#x27;&#x27;) + &#x27;&lt;/span&gt; &#x27; + (d.definition || &#x27;&#x27;));
            });
          });
          var defHtml = defs.join(&#x27;&lt;br&gt;&#x27;);
          // 网络翻译（简单处理）
          var zh = &#x27;&#x27;;
          if (meanings.length &gt; 0 &amp;&amp; meanings[0].definitions &amp;&amp; meanings[0].definitions[0]) {
            var syn = meanings[0].synonyms || [];
            if (syn.length &gt; 0) zh = &#x27;同义词：&#x27; + syn.slice(0, 3).join(&#x27;, &#x27;);
          }
          showDict(word, {ph: ph, zh: zh, def: defHtml, au: &#x27;&#x27;});
        } else {
          showDict(word, {ph: &#x27;&#x27;, zh: &#x27;未找到该词的定义&#x27;, def: &#x27;&#x27;, au: &#x27;&#x27;});
        }
      })
      .catch(function(){
        showDict(word, {ph: &#x27;&#x27;, zh: &#x27;网络查询失败&#x27;, def: &#x27;&#x27;, au: &#x27;&#x27;});
      });
  }
  document.getElementById(&#x27;dict-close&#x27;).addEventListener(&#x27;click&#x27;, function(){
    document.getElementById(&#x27;dict-modal&#x27;).classList.remove(&#x27;show&#x27;);
  });
  document.getElementById(&#x27;dict-modal&#x27;).addEventListener(&#x27;click&#x27;, function(e){
    if (e.target === this) this.classList.remove(&#x27;show&#x27;);
  });

  // 完形 / 预热共用反馈
  function revealFeedback(card, isCorrect){
    card.querySelectorAll(&#x27;label.opt&#x27;).forEach(function(l){
      var input = l.querySelector(&#x27;input&#x27;);
      l.classList.remove(&#x27;right&#x27;, &#x27;wrong&#x27;, &#x27;soft&#x27;);
      if (l.getAttribute(&#x27;data-correct&#x27;) === &#x27;1&#x27;) l.classList.add(&#x27;right&#x27;);
      else if (input &amp;&amp; input.checked) l.classList.add(&#x27;wrong&#x27;);
      else l.classList.add(&#x27;soft&#x27;);
    });
    var fb = card.querySelector(&#x27;.feedback&#x27;);
    if (fb) {
      fb.classList.remove(&#x27;hidden&#x27;);
      fb.classList.toggle(&#x27;wrong&#x27;, !isCorrect);
    }
  }
  cards.forEach(function(card){
    if (card.classList.contains(&#x27;wcard&#x27;)) return;
    card.querySelectorAll(&#x27;input[type=radio]&#x27;).forEach(function(r){
      r.addEventListener(&#x27;change&#x27;, function(){
        var ans = card.getAttribute(&#x27;data-answer&#x27;);
        revealFeedback(card, r.value === ans);
      });
    });
  });

  // 写作反馈
  document.querySelectorAll(&#x27;[data-act=&quot;check-writing&quot;]&#x27;).forEach(function(btn){
    btn.addEventListener(&#x27;click&#x27;, function(){
      var card = btn.closest(&#x27;.q&#x27;);
      var ta = card.querySelector(&#x27;textarea&#x27;);
      var sentence = (ta.value || &#x27;&#x27;).trim();
      if (!sentence) { card.querySelector(&#x27;.writing-msg&#x27;).textContent = &#x27;请先写一句&#x27;; return; }
      var prompt = card.querySelector(&#x27;.prompt&#x27;).textContent;
      var m = prompt.match(/用.{0,20}?(\w+)[、，](\w+)[、，](\w+)/);
      var word = m ? m[1] : &#x27;word&#x27;;
      btn.disabled = true; btn.textContent = &#x27;反馈中…&#x27;;
      fetch(&#x27;/api/check&#x27;, {
        method: &#x27;POST&#x27;, headers: {&#x27;Content-Type&#x27;: &#x27;application/json&#x27;},
        body: JSON.stringify({word: word, sentence: sentence})
      }).then(function(r){ return r.json(); }).then(function(d){
        var msg = card.querySelector(&#x27;.writing-msg&#x27;);
        if (d.error) { msg.textContent = d.error; return; }
        msg.textContent = (d.ok ? &#x27;✓ &#x27; : &#x27;⚠ &#x27;) + d.feedback;
      }).catch(function(e){
        card.querySelector(&#x27;.writing-msg&#x27;).textContent = &#x27;反馈失败：&#x27; + e;
      }).finally(function(){ btn.disabled = false; btn.textContent = &#x27;检查（LLM 一句反馈）&#x27;; });
    });
  });

  // 键盘
  document.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.target &amp;&amp; (e.target.tagName === &#x27;TEXTAREA&#x27; || e.target.tagName === &#x27;INPUT&#x27;)) return;
    if (e.key === &#x27;ArrowRight&#x27; || e.key === &#x27; &#x27;) { e.preventDefault(); navNext(); }
    else if (e.key === &#x27;ArrowLeft&#x27;) { e.preventDefault(); navPrev(); }
    else if ([&#x27;1&#x27;,&#x27;2&#x27;,&#x27;3&#x27;,&#x27;4&#x27;].indexOf(e.key) &gt;= 0) {
      var cur = cards[curIdx];
      if (!cur || !cur.classList.contains(&#x27;wcard&#x27;)) return;
      var map = {&#x27;1&#x27;: 1, &#x27;2&#x27;: 3, &#x27;3&#x27;: 4, &#x27;4&#x27;: 5};
      var q = map[e.key];
      var btn = cur.querySelector(&#x27;.rate[data-q=&quot;&#x27; + q + &#x27;&quot;]&#x27;);
      if (btn) btn.click();
    }
  });

  // 学习报告：会话内汇总
  function renderReport(){
    var stats = {&#x27;1&#x27;: 0, &#x27;3&#x27;: 0, &#x27;4&#x27;: 0, &#x27;5&#x27;: 0};
    var weak = [];
    Object.keys(ratings).forEach(function(w){
      stats[ratings[w]]++;
      if (ratings[w] &lt;= 3) weak.push(w);
    });
    var labels = {1: &#x27;忘了&#x27;, 3: &#x27;模糊&#x27;, 4: &#x27;想起&#x27;, 5: &#x27;熟练&#x27;};
    var cols = [&#x27;1&#x27;,&#x27;3&#x27;,&#x27;4&#x27;,&#x27;5&#x27;].map(function(q){
      return &quot;&lt;div class=&#x27;stat&#x27;&gt;&lt;b&gt;&quot; + stats[q] + &quot;&lt;/b&gt;&lt;span&gt;&quot; + labels[q] + &quot;&lt;/span&gt;&lt;/div&gt;&quot;;
    }).join(&#x27;&#x27;);
    document.getElementById(&#x27;report-stats&#x27;).innerHTML = cols;
    var weakEl = document.getElementById(&#x27;report-weak&#x27;);
    if (weak.length) {
      weakEl.innerHTML = &quot;⚠️ 明天优先复习：&lt;b&gt;&quot; + weak.join(&#x27;、&#x27;) + &quot;&lt;/b&gt;&lt;br&gt;&quot; +
        &quot;睡前再听一遍故事音频，回忆这些词出现的语境。&quot;;
    } else {
      weakEl.innerHTML = &quot;🌟 今天没有弱项！每个词都记牢了，太棒了。&quot;;
    }
  }
  var reportCard = document.querySelector(&#x27;.report-card&#x27;);
  if (reportCard) {
    // 进入报告卡时渲染（在 showCard 里通过 MutationObserver 太复杂，直接监听点击）
    var obs = new MutationObserver(function(){
      if (reportCard.classList.contains(&#x27;active&#x27;)) renderReport();
    });
    obs.observe(reportCard, {attributes: true, attributeFilter: [&#x27;class&#x27;]});
  }

  if (cards.length &gt; 0) showCard(cards[0]);
})();
&lt;/script&gt;

y。"}, {"wrong": "The country is backward in technology.", "correct": "The country is backward in technology.", "note": "此句正确，但注意 backward 作形容词时没有比较级形式，不能说 more backward。"}], "exam_points": ["完形填空：常考 backward 与 forward 的对比，注意上下文方向提示。", "写作：可用 backward 描述技术或社会发展的滞后，如 'The region remains backward in education.'"], "word_family": [{"word": "backwards", "pos": "adv.", "zh": "向后地"}, {"word": "backwardness", "pos": "n.", "zh": "落后；倒退"}, {"word": "forward", "pos": "adv./adj.", "zh": "向前；先进的"}, {"word": "back", "pos": "n./adv./adj.", "zh": "背部；向后；后面的"}], "collocations": [{"en": "backward step", "zh": "后退的一步"}, {"en": "backward glance", "zh": "向后一瞥"}, {"en": "backward country", "zh": "落后国家"}, {"en": "backward and forward", "zh": "来回地"}], "examples": [{"en": "The car suddenly moved backward and hit the wall.", "zh": "那辆车突然向后移动，撞上了墙。"}, {"en": "In some regions, technology is still backward compared to the rest of the world.", "zh": "在一些地区，技术相比世界其他地区仍然落后。"}], "confusions": [{"word": "backwards", "zh": "向后地", "note": "backward 和 backwards 意思相同，但 backward 更常用于形容词，backwards 更常用于副词，尤其在英式英语中。"}]}, {"word": "charter", "phonetic": "UK /tʃɑːtə/ US /tʃɑrtɚ/", "meaning": "宪章；特许状", "kind": "review", "etymology": "来自古法语 chartre，源自拉丁语 chartula，意为“小纸片”，是 charta（纸）的指小形式。最初指写有法律条款的纸张，后引申为“特许状”和“宪章”。", "memory_tips": ["词源故事法：想象一张小小的纸片（chartula）上写着国王的印章，这就是特许状，赋予城市或公司特殊权利。", "场景联想法：你创办了一家公司，需要一张“特许状”（charter）才能合法运营，这张纸就是你的“通行证”。", "对比记忆法：charter（宪章）和 chapter（章节）拼写相似，但 charter 是“特许状”，chapter 是“书的一章”，可以联想：宪章是历史的重要章节。"], "usage_note": "作名词时，常指正式文件，如城市宪章、公司特许状；作动词时，意为“包租（船、飞机等）”。", "common_errors": [{"wrong": "The company has a charter to operate in this area.", "correct": "The company has a charter to operate in this area.", "note": "charter 作名词时，常与不定式搭配，表示“做某事的特许权”。"}], "exam_points": ["完形填空：常考 charter 与 chapter 的拼写辨析。", "阅读：在历史或法律类文章中，charter 常作为关键词出现，需理解其“特许状”含义。"], "word_family": [{"word": "chartered", "pos": "adj.", "zh": "特许的；包租的"}, {"word": "charterer", "pos": "n.", "zh": "租船人；包租者"}, {"word": "chartering", "pos": "n.", "zh": "包租；特许"}], "collocations": [{"en": "royal charter", "zh": "皇家特许状"}, {"en": "charter school", "zh": "特许学校"}, {"en": "charter flight", "zh": "包机"}, {"en": "charter member", "zh": "创始成员"}, {"en": "draft a charter", "zh": "起草宪章"}], "examples": [{"en": "The city's charter was granted by the king in 1215.", "zh": "这座城市的特许状是由国王在1215年授予的。"}, {"en": "They chartered a private jet to fly to the conference.", "zh": "他们包租了一架私人飞机去参加会议。"}], "confusions": [{"word": "constitution", "zh": "宪法", "note": "charter 指特定组织或城市的特许文件，constitution 指国家或组织的根本大法，范围更广。"}]}]</script>

<script>

(function(){
  var SERVER = false;

  // ---- 旧锚点链接兼容：/#today 等跳转到独立页 ----
  var hashTarget = {
    '#today': SERVER ? '/today' : 'today.html',
    '#review': SERVER ? '/review' : 'review.html',
    '#quiz': SERVER ? '/quiz' : 'quiz.html',
    '#records': SERVER ? '/records' : 'records.html'
  }[location.hash];
  if (hashTarget) { location.replace(hashTarget); return; }

  // ---- 学习卡 iframe 高度自适应 ----
  function fitFrames(){
    document.querySelectorAll('iframe.study-frame').forEach(function(f){
      try {
        var h = f.contentDocument.documentElement.scrollHeight;
        f.style.height = Math.min(h + 40, 16000) + 'px';
      } catch(e){}
    });
  }
  document.querySelectorAll('iframe.study-frame').forEach(function(f){
    f.addEventListener('load', fitFrames);
  });
  window.addEventListener('resize', fitFrames);

  // ---- 完成 / 缺勤 ----
  document.querySelectorAll('[data-act]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var act = btn.getAttribute('data-act');
      var day = parseInt(btn.getAttribute('data-day'), 10);
      var url = act === 'complete' ? '/api/study-complete' : '/api/absent';
      var payload = {day_num: day};
      if (act === 'absent') {
        var reason = window.prompt('缺勤原因（可留空）：', '当天没有学习');
        if (reason === null) return;
        payload.reason = reason || '当天没有学习';
      }
      btn.disabled = true; btn.textContent = '提交中…';
      fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                  body: JSON.stringify(payload)})
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d.ok) { location.reload(); }
          else { alert('失败：' + (d.error || 'unknown')); btn.disabled = false; btn.textContent = act === 'complete' ? '✓ 完成今日学习' : '今天没学 · 标记缺勤'; }
        })
        .catch(function(){
          alert('无法连接服务，标记失败（静态快照下请使用 xiaohan serve）');
          btn.disabled = false; btn.textContent = act === 'complete' ? '✓ 完成今日学习' : '今天没学 · 标记缺勤';
        });
    });
  });

  // ---- 复习打卡 ----
  document.querySelectorAll('.due-item button[data-q]').forEach(function(b){
    b.addEventListener('click', function(){
      var item = b.closest('.due-item');
      var word = item.getAttribute('data-word');
      var q = parseInt(b.getAttribute('data-q'), 10);
      item.classList.add('rating-busy');
      fetch('/api/review', {method:'POST', headers:{'Content-Type':'application/json'},
                            body: JSON.stringify({word: word, quality: q, channel: 'home'})})
        .then(function(r){ return r.json(); })
        .then(function(d){
          item.classList.remove('rating-busy');
          if (d.ok) {
            item.classList.add('rated');
            item.querySelector('.rating').innerHTML = '<span class="rated-tag">✓ 已打卡 · ' + (d.new_state || '') + ' · 下次 ' + (d.due_date || '') + '</span>';
          } else {
            item.querySelector('.rating').innerHTML = '<span class="rated-tag bad">打卡失败：' + (d.error || '') + '</span>';
          }
        })
        .catch(function(){
          item.classList.remove('rating-busy');
          item.querySelector('.rating').innerHTML = '<span class="rated-tag bad">静态快照无法打卡</span>';
        });
    });
  });

  // ---- 单词测验 ----
  var QUIZ_BANK = [];
  var qbox = document.getElementById('quiz-box');
  var qCountSel = document.getElementById('quiz-count');
  var qDirSel = document.getElementById('quiz-dir');
  // ---- 记录：选择日期回学 ----
  var dayPick = document.getElementById('day-pick');
  if (dayPick) {
    dayPick.addEventListener('change', function(){
      if (dayPick.value) { location.href = dayPick.value; }
    });
  }

  var quizStart = document.getElementById('quiz-start');

  function shuffleArr(arr){
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  var quizBank = QUIZ_BANK.slice();   // 全部已学词（也是选项干扰词来源）
  var quizPool = quizBank.slice();    // 待选池：本轮抽走的词移出，答错的词放回
  var lastRound = [];                 // 上一轮题词：补池时先绕过，避免下一组整组重播
  var roundWrong = [];                // 本轮答错的词（下一组放回池中，可再次出现）
  var lastAudio = null;               // 复用同一个 Audio 对象

  function speak(src){
    if (!src) return;
    try {
      if (lastAudio) { try { lastAudio.pause(); } catch(e){} }
      lastAudio = new Audio(src);
      var p = lastAudio.play();
      if (p && p.catch) p.catch(function(){});
    } catch(e){}
  }

  function startQuiz(){
    if (!qbox) return;
    if (!quizBank || quizBank.length === 0) {
      qbox.innerHTML = '<p class="empty-hint">已学词不足，先完成几天学习再来测验。</p>';
      return;
    }
    // 上一轮答错的词放回待选池 → 下一组可再次出现（放回词库对象，而非字符串）
    for (var wi = 0; wi < roundWrong.length; wi++) {
      var bw = null;
      for (var bi = 0; bi < quizBank.length; bi++) {
        if (quizBank[bi].word === roundWrong[wi]) { bw = quizBank[bi]; break; }
      }
      if (bw && quizPool.indexOf(bw) === -1) quizPool.push(bw);
    }
    roundWrong = [];
    var N = parseInt(qCountSel ? qCountSel.value : '10', 10) || 10;
    // 待选池不足时从全库补足：先绕过上一轮刚测过的词，避免下一组整组重播
    if (quizPool.length < N) {
      var exclude = {};
      for (var li = 0; li < lastRound.length; li++) exclude[lastRound[li].word] = true;
      var cand = quizBank.filter(function(w){
        return quizPool.indexOf(w) === -1 && !exclude[w.word];
      });
      shuffleArr(cand);
      var need = N - quizPool.length;
      var add = cand.slice(0, need);
      if (add.length < need) {  // 已学词本身少于题量时，不得已才复用上一轮
        var rest = quizBank.filter(function(w){ return quizPool.indexOf(w) === -1; });
        shuffleArr(rest);
        add = add.concat(rest.slice(0, need - add.length));
      }
      quizPool = quizPool.concat(add);
    }
    shuffleArr(quizPool);
    var round = quizPool.splice(0, Math.min(N, quizPool.length));
    lastRound = round;
    var i = 0, score = 0, streak = 0, best = 0;
    var results = [];

    // 从全量词库挑 3 个干扰选项（避免与正确词/已选值重复）
    function pickOptions(w, zh2en){
      var srcs = quizBank.slice();
      var dists = [], used = {};
      while (dists.length < 3 && srcs.length) {
        var idx = Math.floor(Math.random() * srcs.length);
        var c = srcs.splice(idx, 1)[0];
        var val = zh2en ? c.word : c.zh;
        if (c.word === w.word) continue;
        if (!zh2en && c.zh === w.zh) continue;
        if (used[val]) continue;
        used[val] = true;
        dists.push(c);
      }
      return dists;
    }
    function buildQuestion(w){
      var dir = qDirSel ? qDirSel.value : 'random';
      var zh2en = dir === 'zh2en' ? true : (dir === 'en2zh' ? false : Math.random() < 0.5);
      var dists = pickOptions(w, zh2en);
      var opts = dists.map(function(d){ return zh2en ? d.word : d.zh; });
      var ans = zh2en ? w.word : w.zh;
      opts.push(ans);
      shuffleArr(opts);
      return {word: w.word, phonetic: w.phonetic, zh: w.zh,
              type: zh2en ? 'zh2en' : 'en2zh', answer: ans, options: opts,
              audio: w.audio || ''};
    }
    function qhead(){
      return '<div class="quiz-top"><span class="quiz-pos">' + (i+1) + ' / ' + round.length + '</span>' +
        '<span class="quiz-score">得分 <b>' + score + '</b></span>' +
        '<span class="quiz-streak">连击 <b>' + streak + '</b></span></div>';
    }
    function show(){
      var q = buildQuestion(round[i]);
      var zh2en = q.type === 'zh2en';
      var prompt = zh2en ? q.zh : q.word;
      var ph = zh2en ? '' : '<span class="phon">' + q.phonetic + '</span>';
      var spk = q.audio
        ? '<button type="button" class="quiz-speak" data-src="' + q.audio.replace(/"/g,'&quot;') + '" title="播放读音">🔊</button>'
        : '';
      var opts = q.options.map(function(o){
        return '<button type="button" class="q-opt" data-v="' + o.replace(/"/g,'&quot;') + '">' + o + '</button>';
      }).join('');
      qbox.innerHTML = qhead() +
        '<div class="quiz-q"><span class="quiz-tag">' + (zh2en ? '中选英' : '英选中') + '</span>' +
        '<div class="quiz-prompt">' + prompt + ph + spk + '</div>' +
        '<div class="quiz-opts">' + opts + '</div>' +
        '<div class="quiz-fb"></div></div>';
      qbox.querySelectorAll('.q-opt').forEach(function(b){
        b.addEventListener('click', function(){ answer(q, b); });
      });
      qbox.querySelectorAll('.quiz-speak').forEach(function(b){
        b.addEventListener('click', function(){ speak(b.getAttribute('data-src')); });
      });
      // 英选中：题目出现即自动读单词
      if (!zh2en && q.audio) speak(q.audio);
    }
    function answer(q, btn){
      var zh2en = q.type === 'zh2en';
      var correct = btn.getAttribute('data-v') === q.answer;
      var fb = qbox.querySelector('.quiz-fb');
      var opts = qbox.querySelectorAll('.q-opt');
      opts.forEach(function(b){
        b.disabled = true;
        if (b.getAttribute('data-v') === q.answer) b.classList.add('right');
        else if (b === btn) b.classList.add('wrong');
      });
      results.push({word: q.word, direction: q.type, correct: correct});
      if (correct) { score += 1; streak += 1; best = Math.max(best, streak); }
      else { streak = 0; roundWrong.push(q.word); }
      var label = '答案：<b>' + q.answer + '</b>' + (correct ? '（对啦）' : '（记错了，下一组会再遇到它）');
      fb.innerHTML = '<div class="quiz-fb-inner ' + (correct ? 'ok' : 'bad') + '">' + label +
        '<button class="btn btn-primary q-next">下一题 →</button></div>';
      qbox.querySelector('.q-next').addEventListener('click', next);
      // 中选英：答完后自动读正确单词
      if (zh2en && q.audio) speak(q.audio);
    }
    function next(){
      i += 1;
      if (i >= round.length) { done(); return; }
      show();
    }
    function done(){
      var wrong = roundWrong.slice();
      var wrongHtml = wrong.length
        ? '<div class="quiz-wrong">错词（已排入明日复习）：' + wrong.map(function(w){
            return '<span class="tag-wrong">' + w + '</span>';
          }).join('') + '</div>'
        : '';
      var note = SERVER ? '' : '<p class="empty-hint">静态快照：错词复习在 xiaohan serve 下才会真正入队。</p>';
      qbox.innerHTML =
        '<div class="quiz-done"><div class="quiz-score-big">' + score + ' / ' + round.length + '</div>' +
        '<p>正确率 ' + Math.round(100*score/round.length) + '% · 最佳连击 ' + best + ' 题</p>' +
        wrongHtml + note +
        '<button class="btn btn-primary q-again">再测一组</button></div>';
      qbox.querySelector('.q-again').addEventListener('click', startQuiz);
      if (SERVER && results.length) {
        fetch('/api/quiz-submit', {method:'POST', headers:{'Content-Type':'application/json'},
                                   body: JSON.stringify({results: results})})
          .then(function(r){ return r.json(); })
          .then(function(){})
          .catch(function(){});
      }
    }
    show();
  }

  if (quizStart) quizStart.addEventListener('click', startQuiz);
  startQuiz();
})();

// ---- 单词解说弹窗 ----
var WORD_DATA = [];
try {
  var wdEl = document.getElementById('word-data');
  if (wdEl) WORD_DATA = JSON.parse(wdEl.textContent || '[]');
} catch(e){}

function openWordsExplain() {
  var modal = document.getElementById('we-modal');
  if (!modal) return;
  var body = document.getElementById('we-body');
  if (!body) return;
  if (!WORD_DATA.length) {
    body.innerHTML = '<p class="we-empty">暂无今日单词数据。</p>';
    modal.style.display = 'flex';
    return;
  }
  var html = '';
  WORD_DATA.forEach(function(w, i){
    var secs = '';
    if (w.etymology) secs += '<div class="we-sec etym"><div class="we-sec-title">📖 词根拆解</div>' + escHtml(w.etymology) + '</div>';
    if (w.memory_tips && w.memory_tips.length) secs += '<div class="we-sec memory"><div class="we-sec-title">🧠 记忆法</div><ul style="margin:0 0 0 16px;padding:0">' + w.memory_tips.map(function(t){ return '<li>' + escHtml(t) + '</li>'; }).join('') + '</ul></div>';
    if (w.usage_note) secs += '<div class="we-sec usage"><div class="we-sec-title">💡 用法</div>' + escHtml(w.usage_note) + '</div>';
    if (w.common_errors && w.common_errors.length) {
      var errs = w.common_errors.map(function(e){
        return '<div class="we-err"><div class="wrong">❌ <s>' + escHtml(e.wrong || '') + '</s></div><div class="right">✅ ' + escHtml(e.correct || '') + '</div>' + (e.note ? '<div class="note">' + escHtml(e.note) + '</div>' : '') + '</div>';
      }).join('');
      secs += '<div class="we-sec error"><div class="we-sec-title">⚠️ 易错点</div>' + errs + '</div>';
    }
    if (w.exam_points && w.exam_points.length) secs += '<div class="we-sec exam"><div class="we-sec-title">🎯 考点</div><ul style="margin:0 0 0 16px;padding:0">' + w.exam_points.map(function(p){ return '<li>' + escHtml(p) + '</li>'; }).join('') + '</ul></div>';
    if (w.word_family && w.word_family.length) {
      var chips = w.word_family.map(function(f){
        return '<span class="we-chip"><b>' + escHtml(f.word || '') + '</b> ' + escHtml(f.pos || '') + ' <span class="chip-zh">' + escHtml(f.zh || '') + '</span></span>';
      }).join('');
      secs += '<div class="we-sec family"><div class="we-sec-title">🌳 词族</div>' + chips + '</div>';
    }
    if (w.collocations && w.collocations.length) {
      var chips = w.collocations.map(function(c){
        if (typeof c === 'object' && c.en) return '<span class="we-chip"><b>' + escHtml(c.en) + '</b> <span class="chip-zh">' + escHtml(c.zh || '') + '</span></span>';
        return '<span class="we-chip">' + escHtml(c) + '</span>';
      }).join('');
      secs += '<div class="we-sec colloc"><div class="we-sec-title">🔗 常见搭配</div>' + chips + '</div>';
    }
    if (w.examples && w.examples.length) {
      var exs = w.examples.map(function(e){
        return '<li style="margin:6px 0;line-height:1.7"><b>' + escHtml(e.en || '') + '</b><br><span style="color:var(--muted);font-size:13px">' + escHtml(e.zh || '') + '</span></li>';
      }).join('');
      secs += '<div class="we-sec examples"><div class="we-sec-title">✏️ 真实例句</div><ul style="margin:0 0 0 16px;padding:0">' + exs + '</ul></div>';
    }
    if (w.confusions && w.confusions.length) {
      var confs = w.confusions.map(function(c){
        return '<li style="margin:4px 0;line-height:1.6"><b>' + escHtml(c.word || '') + '</b>（' + escHtml(c.zh || '') + '）— ' + escHtml(c.note || '') + '</li>';
      }).join('');
      secs += '<div class="we-sec confuse"><div class="we-sec-title">🔍 近义辨析</div><ul style="margin:0 0 0 16px;padding:0">' + confs + '</ul></div>';
    }
    if (!secs) secs = '<p style="color:var(--muted);font-size:13px">暂无详细解说。</p>';
    html += '<div class="we-word">' +
      '<div class="we-word-head" onclick="toggleWord(this)" data-idx="' + i + '">' +
      '<span class="we-en">' + escHtml(w.word) + '</span>' +
      '<span class="we-ph">' + escHtml(w.phonetic || '') + '</span>' +
      '<span class="we-zh">' + escHtml(w.meaning) + '</span>' +
      '<span class="we-toggle">▼</span></div>' +
      '<div class="we-word-body">' + secs + '</div>' +
      '</div>';
  });
  body.innerHTML = html;
  modal.style.display = 'flex';
}

function closeWordsExplain() {
  document.getElementById('we-modal').style.display = 'none';
}

function toggleWord(head) {
  var body = head.nextElementSibling;
  var toggle = head.querySelector('.we-toggle');
  if (body.classList.contains('open')) {
    body.classList.remove('open');
    toggle.textContent = '▼';
  } else {
    body.classList.add('open');
    toggle.textContent = '▲';
  }
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

</script>
